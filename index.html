{s:1,t:"data",q:"다음 중 PB(페타바이트)보다 한 단계 큰 데이터 단위는?",o:["TB","EB","ZB","YB"],a:1,
e:"데이터 단위는 1000배(정확히는 1024배)씩 커져요.\nKB → MB → GB → TB → PB → EB → ZB → YB\nPB 바로 다음은 EB(엑사바이트)예요.\n\n다른 보기는?\n① TB: PB보다 한 단계 작음\n③ ZB: EB 다음 (PB보다 두 단계 큼)\n④ YB: 가장 큰 단위",
m:["외우는 요령: 킬로-메가-기가-테라-페타-엑사-제타-요타","1 TB = 1,000 GB, 1 PB = 1,000 TB","빅데이터는 보통 테라바이트~페타바이트 이상 규모를 말해요"]},

{s:1,t:"data",q:"SQL 명령어 중 DML(데이터 조작어)이 아닌 것은?",o:["SELECT","INSERT","UPDATE","CREATE"],a:3,
e:"CREATE는 테이블 같은 구조를 '정의'하는 DDL(데이터 정의어)이에요.\nDML은 이미 있는 테이블 안의 데이터를 조회·추가·수정·삭제하는 명령이에요.\n\n· SELECT: 조회\n· INSERT: 추가\n· UPDATE: 수정\n· DELETE: 삭제",
m:["DDL(정의): CREATE, ALTER, DROP, TRUNCATE","DML(조작): SELECT, INSERT, UPDATE, DELETE","DCL(제어): GRANT(권한 부여), REVOKE(권한 회수)","TCL(트랜잭션): COMMIT, ROLLBACK","SELECT 기본 구조: SELECT 열 FROM 테이블 WHERE 조건 GROUP BY 그룹 HAVING 그룹조건 ORDER BY 정렬"]},

{s:1,t:"data",q:"'데이터에 대한 데이터'로, 데이터의 구조·속성·위치 등을 설명하는 것은?",o:["인덱스","메타데이터","스키마 로그","데이터 마트"],a:1,
e:"메타데이터(Metadata)는 데이터 자체가 아니라 그 데이터를 설명하는 정보예요. 사진 파일의 촬영 날짜·카메라 기종·크기, 테이블의 열 이름·자료형 같은 것이 메타데이터예요.\n\n다른 보기는?\n① 인덱스: 책의 색인처럼 검색 속도를 높이는 구조\n④ 데이터 마트: 특정 부서용 소규모 데이터 웨어하우스",
m:["메타데이터는 데이터 표준화(데이터 거버넌스)에서도 핵심 관리 대상","데이터 사전(Data Dictionary): 메타데이터를 모아둔 것","반정형 데이터(XML, JSON)는 메타데이터를 데이터 안에 포함"]},

{s:1,t:"data",q:"축적된 데이터를 다차원으로 분석해 의사결정을 지원하는 처리 방식은?",o:["OLTP","OLAP","ETL","EAI"],a:1,
e:"OLAP(On-Line Analytical Processing)는 데이터를 '지역별·기간별·상품별'처럼 여러 차원으로 잘라 보며 분석하는 방식이에요. 주로 데이터 웨어하우스 위에서 동작해요.\n\n다른 보기는?\n① OLTP: 주문·결제처럼 실시간 거래를 처리 (운영계, 갱신 위주)\n③ ETL: 원천 데이터를 추출·변환·적재하는 과정\n④ EAI: 여러 시스템을 연결하는 통합 솔루션",
m:["OLTP: 현재 데이터, 갱신 위주, 짧은 트랜잭션, 정규화","OLAP: 과거~현재 데이터, 조회 위주, 복잡한 분석, 비정규화","OLAP 연산: 드릴다운(상세로), 롤업(요약으로), 슬라이스·다이스(잘라 보기), 피벗(축 회전)"]},

{s:1,t:"big",q:"빅데이터의 기본 특징 3V에 해당하지 않는 것은?",o:["Volume","Variety","Velocity","Validity"],a:3,
e:"3V는 Volume(규모), Variety(다양성), Velocity(속도)예요. Validity(유효성)는 3V에 포함되지 않아요.\n\n· Volume: 데이터 양이 매우 큼\n· Variety: 정형·반정형·비정형 등 형태가 다양\n· Velocity: 생성·처리 속도가 빠름 (실시간)",
m:["4V: 3V + Value(가치)","5V: 3V + Value + Veracity(정확성·신뢰성)","ROI 관점: 3V는 투자 비용 요소, Value는 비즈니스 효과","빅데이터는 '데이터 + 처리 기술 + 인재·조직'까지 포함하는 넓은 개념으로도 정의돼요"]},

{s:1,t:"big",q:"사물인터넷 시대의 가치 패러다임 변화 순서로 옳은 것은?",o:["Digitalization → Connection → Agency","Connection → Digitalization → Agency","Agency → Connection → Digitalization","Digitalization → Agency → Connection"],a:0,
e:"① Digitalization(디지털화): 아날로그를 디지털로 바꾸는 것이 가치 (운영체제, 오피스 프로그램)\n② Connection(연결): 디지털화된 정보와 대상을 연결하는 것이 가치 (구글 검색, 페이스북)\n③ Agency(에이전시): 복잡한 연결을 잘 관리해 주는 것이 가치 (사물인터넷 시대)",
m:["빅데이터의 미래 3요소: 데이터(모든 것의 데이터화), 기술(진화하는 알고리즘·AI), 인력(데이터 사이언티스트, 알고리즈미스트)","Agency 단계에서는 연결을 '얼마나 효과적이고 믿을 만하게' 관리하느냐가 핵심"]},

{s:1,t:"big",q:"개인정보를 다른 목적으로 활용해 생기는 '사생활 침해'의 통제 방안은?",o:["결과 기반 책임 원칙 고수","개인정보 제공자의 동의제에서 사용자의 책임제로 전환","알고리즈미스트 고용","데이터 전수 조사"],a:1,
e:"빅데이터는 처음 수집할 때 예상하지 못한 목적으로도 쓰이기 때문에, 매번 정보 주인에게 '동의'를 받는 방식은 한계가 있어요. 그래서 데이터를 '사용하는 쪽'이 책임을 지도록 바꾸자는 것이 통제 방안이에요.\n\n다른 보기는?\n① 결과 기반 책임: '책임 원칙 훼손'의 통제 방안\n③ 알고리즈미스트: '데이터 오용'의 통제 방안",
m:["사생활 침해 → 동의에서 책임으로","책임 원칙 훼손 → 결과 기반 책임","데이터 오용 → 알고리즘 접근 허용, 알고리즈미스트","익명화(비식별화)도 사생활 침해를 줄이는 기술적 방법"]},

{s:1,t:"big",q:"'나이가 구매 차량 타입에 어떤 영향을 미치는가?'에 적합한 빅데이터 활용 기법은?",o:["연관규칙 학습","회귀분석","유형분석","감정분석"],a:1,
e:"하나의 변수(나이, 독립변수)가 다른 변수(구매 차량, 종속변수)에 '어떤 영향을 미치는지' 보는 것이 회귀분석이에요.\n\n다른 보기는?\n① 연관규칙: 같이 일어나는 것 (커피 사는 사람이 탄산음료도 사나?)\n③ 유형분석: 어느 집단에 속하는지 분류 (이 사용자는 어떤 특성의 집단?)\n④ 감정분석: 글의 긍정·부정 (새 정책에 대한 반응은?)",
m:["키워드 매칭: '영향' → 회귀분석, '같이' → 연관규칙, '어느 그룹' → 유형분석","'최적·배치' → 유전 알고리즘, '추천·학습' → 기계학습","'영향력 있는 사람·관계' → 소셜 네트워크 분석"]},

{s:1,t:"ds",q:"데이터 사이언스에서 인문학적 사고가 중요해진 외부 환경 변화로 옳지 않은 것은?",o:["단순 세계화 → 복잡한 세계화","제품 생산 → 서비스","생산 → 시장 창조","서비스 → 제품 생산"],a:3,
e:"경제의 중심이 '물건을 만드는 것'에서 '서비스를 제공하는 것'으로 옮겨갔어요. 그래서 방향은 제품 생산 → 서비스이고, ④는 거꾸로예요.\n\n변화 3가지\n① 단순 세계화 → 복잡한 세계화: 다양한 문화와 맥락 이해 필요\n② 비즈니스 중심이 제품 생산 → 서비스로\n③ 경제와 산업 논리가 생산 → 시장 창조로",
m:["인문학적 역량은 데이터 사이언티스트의 Soft Skill(통찰력, 스토리텔링)과 연결","데이터 사이언티스트는 '가설을 세우고 스토리를 전달하는 능력'이 중요"]},

{s:1,t:"ds",q:"데이터 사이언스에 대한 설명으로 옳지 않은 것은?",o:["통계학, IT, 비즈니스 지식이 결합된 분야이다","분석 결과를 전달하고 구현하는 것까지 포함한다","정형 데이터만을 분석 대상으로 한다","데이터마이닝보다 더 넓은 개념이다"],a:2,
e:"데이터 사이언스는 정형 데이터뿐 아니라 텍스트·이미지 같은 비정형 데이터까지 모두 다뤄요.\n\n데이터마이닝이 주로 '분석'에 집중한다면, 데이터 사이언스는 분석 + 결과의 효과적 전달 + 시스템 구현까지 포괄하는 더 넓은 개념이에요.",
m:["데이터 사이언스 구성 영역: Analytics(수학·통계), IT(프로그래밍, 데이터 엔지니어링), 비즈니스 분석(커뮤니케이션, 시각화)","전략적 통찰이 없는 분석의 함정: 일차원적 분석만 반복하면 경쟁 우위를 얻기 어려움","분석 모델은 현실을 단순화한 것 → 가정과 한계를 이해하고 해석해야 함"]},

// ===================== 2과목 추가 =====================
{s:2,t:"discover",q:"하향식 문제 탐색에서 비즈니스 모델 캔버스로 살펴보는 영역이 아닌 것은?",o:["업무","제품","고객","경쟁자"],a:3,
e:"비즈니스 모델 캔버스 기반 문제 탐색은 회사 '내부'의 5개 영역을 봐요: 업무, 제품, 고객, 규제와 감사, 지원 인프라.\n\n'경쟁자'는 회사 밖을 보는 '분석 기회 발굴의 범위 확장' 관점(경쟁자 확대)에 들어가요.",
m:["비즈니스 모델 캔버스 5영역: 업무 · 제품 · 고객 · 규제와 감사 · 지원 인프라","범위 확장 4관점: 거시적 관점(STEEP) · 경쟁자 확대(대체재, 경쟁자, 신규 진입자) · 시장 니즈 변화(고객, 채널, 영향자들) · 역량의 재해석(내부 역량, 파트너 네트워크)","하향식 절차: 문제 탐색 → 문제 정의 → 해결방안 탐색 → 타당성 검토"]},

{s:2,t:"discover",q:"거시적 관점의 환경 분석 STEEP에 해당하지 않는 것은?",o:["Social(사회)","Technological(기술)","Economic(경제)","Customer(고객)"],a:3,
e:"STEEP = Social(사회), Technological(기술), Economic(경제), Environmental(환경), Political(정치)\n회사를 둘러싼 큰 흐름(거시 환경)을 보는 틀이라, 개별 고객은 들어가지 않아요.\n\n고객은 '시장 니즈 변화' 관점(고객, 채널, 영향자들)에서 다뤄요.",
m:["S: 인구 구조, 문화, 라이프스타일","T: 신기술, 기술 혁신","E: 경기, 금리, 산업 구조","E: 환경 규제, 기후","P: 정책, 법·규제"]},

{s:2,t:"discover",q:"하향식 접근에서 '경제적 타당성'과 '데이터 및 기술적 타당성'을 따지는 단계는?",o:["문제 탐색","문제 정의","해결방안 탐색","타당성 검토"],a:3,
e:"하향식 마지막 단계인 타당성 검토에서 해결방안이 실제로 해볼 만한지 따져요.\n· 경제적 타당성: 비용 대비 편익(효과)이 있는가\n· 데이터 및 기술적 타당성: 필요한 데이터가 있고, 분석 역량·기술이 되는가\n\n다른 단계는?\n① 문제 탐색: 비즈니스 모델 캔버스로 문제 찾기\n② 문제 정의: 비즈니스 문제를 데이터 분석 문제로 변환\n③ 해결방안 탐색: 기존 시스템·역량으로 되는지 검토",
m:["문제 정의 예: '고객 이탈 증가'(비즈니스 문제) → '이탈 가능 고객 예측'(데이터 분석 문제)","해결방안 탐색: 분석 역량이 없으면 교육·채용, 아웃소싱 고려","타당성 검토 결과 → 분석 과제 정의서 작성"]},

{s:2,t:"method",q:"이전 단계가 완료되어야 다음 단계로 넘어가며, 단계를 순서대로 진행하는 방법론 모델은?",o:["폭포수 모델","프로토타입 모델","나선형 모델","애자일 모델"],a:0,
e:"폭포수(Waterfall) 모델은 물이 위에서 아래로 떨어지듯 단계를 순서대로 진행해요. 앞 단계를 끝내야 다음으로 가고, 문제가 생기면 이전 단계로 돌아가는 피드백(Feedback)이 있어요. 요구사항이 명확할 때 적합해요.\n\n다른 보기는?\n② 프로토타입: 일단 빠르게 시제품을 만들어 보고 개선 (요구사항이 불명확할 때, 상향식에 적합)\n③ 나선형: 반복하며 점진적으로 완성, 복잡한 프로젝트에 적합하지만 관리가 어려움",
m:["폭포수 = 순차 · 하향식에 적합","프로토타입 = 빠른 시제품 · 상향식에 적합","나선형 = 반복 · 위험 관리 강조","방법론 생성 과정: 암묵지 → 형식화 → 형식지 → 체계화 → 방법론 → 내재화 → 암묵지"]},

{s:2,t:"method",q:"KDD 방법론에서 '학습용 데이터와 검증용 데이터를 분리'하는 단계는?",o:["데이터셋 선택","데이터 전처리","데이터 변환","데이터 마이닝"],a:2,
e:"KDD의 '변환' 단계에서 분석 목적에 맞게 변수를 고르고(변수 선택), 차원을 줄이고(차원 축소), 학습용·검증용 데이터를 나눠요. 많이 헷갈려서 자주 나오는 문제예요.\n\n다른 단계는?\n① 선택: 분석 목표 설정, 데이터셋 선택\n② 전처리: 잡음, 이상치, 결측치 처리\n④ 마이닝: 분석 기법 선택, 알고리즘으로 패턴 찾기",
m:["KDD: 선택 → 전처리 → 변환 → 마이닝 → 해석·평가","CRISP-DM에서는 '데이터 준비' 단계에서 정제·통합·포맷팅","CRISP-DM '모델링' 단계에서 테스트용 데이터셋으로 평가 → 과적합 문제 발견 가능"]},

{s:2,t:"plan",q:"분석 기획을 '과제 단위'로 할 때의 특징으로 옳은 것은?",o:["Quick-Win, Speed & Test","Accuracy & Deploy","장기적 마스터플랜","Problem Definition 중심"],a:0,
e:"과제 단위(단기)는 당장의 문제를 빠르게 해결해서 성과를 보여주는 게 목적이에요. 그래서 Quick-Win(빠른 성과), Speed & Test, Problem Solving 중심이에요.\n\n②③④는 마스터플랜 단위(중장기)의 특징이에요. 지속적인 분석 문화 정착을 목표로 Accuracy & Deploy, Problem Definition에 집중해요.",
m:["과제 단위: Speed & Test · Quick-Win · Problem Solving","마스터플랜 단위: Accuracy & Deploy · Long Term View · Problem Definition","두 가지를 융합해 단기 성과와 장기 로드맵을 함께 가져가는 것이 바람직"]},

{s:2,t:"plan",q:"분석 기획 시 고려사항으로 거리가 먼 것은?",o:["가용 데이터 확인","적절한 유스케이스 탐색","분석 수행 시 장애요소에 대한 사전 계획","가장 최신 분석 도구의 우선 도입"],a:3,
e:"분석 기획 고려사항은 3가지예요.\n① 가용 데이터: 분석에 쓸 수 있는 데이터가 있는지, 어떤 유형인지 확인\n② 적절한 유스케이스: 이미 검증된 사례를 활용해 기대효과를 공감시킴\n③ 장애요소 사전 계획: 비용, 정확도와 사용성, 교육, 변화 관리 등\n\n'최신 도구 도입'은 고려사항이 아니에요. 도구보다 목적과 데이터가 먼저예요.",
m:["분석 기획 = 분석 대상(What)과 분석 방법(How)을 정하는 것","데이터 사이언티스트 역량: 수학·통계 + 정보기술 + 해당 비즈니스 도메인 지식","분석 주제 4유형: 최적화 · 솔루션 · 통찰 · 발견"]},

{s:2,t:"gov",q:"데이터 거버넌스 체계 중 '데이터 표준화' 활동에 해당하는 것은?",o:["데이터 사전 구축","분석 과제 우선순위 평가","분석 조직 구성","성숙도 진단"],a:0,
e:"데이터 표준화는 회사 전체가 데이터를 같은 이름과 규칙으로 쓰도록 맞추는 활동이에요.\n· 데이터 표준 용어 설정\n· 명명 규칙 수립\n· 메타데이터 구축\n· 데이터 사전 구축\n\n다른 보기는 데이터 거버넌스가 아닌 분석 마스터플랜·분석 거버넌스 영역이에요.",
m:["데이터 거버넌스 체계: 데이터 표준화 · 데이터 관리 체계 · 데이터 저장소 관리 · 표준화 활동","데이터 관리 체계: 메타데이터·데이터 사전의 관리 원칙, 데이터 생명주기 관리","데이터 저장소 관리: 메타데이터·표준 데이터를 관리하는 전사 저장소(Repository)","데이터 거버넌스 구성요소: 원칙 · 조직 · 프로세스"]},

{s:2,t:"gov",q:"분석 준비도(Readiness) 진단 영역이 아닌 것은?",o:["분석 업무 파악","인력 및 조직","분석 기법","분석 성과 보상"],a:3,
e:"분석 준비도는 6개 영역으로 진단해요.\n① 분석 업무 파악\n② 인력 및 조직\n③ 분석 기법\n④ 분석 데이터\n⑤ 분석 문화\n⑥ IT 인프라\n\n'성과 보상'은 진단 영역에 없어요.",
m:["준비도 6영역: 업무 · 인력/조직 · 기법 · 데이터 · 문화 · IT 인프라","성숙도 4단계: 도입 → 활용 → 확산 → 최적화","준비도 × 성숙도 → 준비형, 도입형, 정착형, 확산형"]},

{s:2,t:"gov",q:"분석 거버넌스 체계의 구성요소가 아닌 것은?",o:["분석 조직","과제 기획·운영 프로세스","분석 교육·마인드 육성 체계","외부 홍보 채널"],a:3,
e:"분석 거버넌스(분석을 회사에 정착시키는 관리 체계)의 구성요소는 5가지예요.\n① 조직(Organization)\n② 과제 기획·운영 프로세스(Process)\n③ 분석 관련 IT 시스템(System)\n④ 분석 교육·마인드 육성 체계(Human Resource)\n⑤ 데이터(Data)\n\n외부 홍보 채널은 포함되지 않아요.",
m:["분석 거버넌스 5요소: 조직 · 프로세스 · 시스템 · 인적 자원(교육) · 데이터","데이터 거버넌스 3요소(원칙 · 조직 · 프로세스)와 구분","분석 과제 관리 프로세스: 과제 발굴(아이디어 → 후보 제안 → 확정) → 과제 수행(팀 구성 → 실행 → 진행 관리 → 결과 공유)"]},

// ===================== 3과목 추가 =====================
{s:3,t:"r",q:"R에서 m <- matrix(1:6, nrow=2) 일 때 m[1, 3]의 값은?",o:["3","4","5","6"],a:2,
e:"matrix는 기본적으로 '열 방향'으로 값을 채워요.\n     [,1] [,2] [,3]\n[1,]   1    3    5\n[2,]   2    4    6\n\nm[1, 3] = 1행 3열 = 5\n\nbyrow = TRUE였다면 1 2 3 / 4 5 6 이 되어 m[1, 3] = 3이에요.",
m:["m[행, 열] 순서로 인덱싱","m[1, ] = 1행 전체, m[, 2] = 2열 전체","dim(m) → 2 3 (행 수, 열 수)","t(m): 전치 행렬 (행과 열 바꾸기)","행렬 곱: m %*% n, 원소끼리 곱: m * n"]},

{s:3,t:"r",q:"R에서 x <- c(10, 20, 30, 40) 일 때 x[-1]의 결과는?",o:["40","10","20 30 40","10 20 30"],a:2,
e:"R에서 음수 인덱스는 '그 위치를 빼고' 가져와요. x[-1]은 첫 번째 원소(10)를 제외한 20 30 40.\n\n파이썬처럼 '마지막 원소'를 뜻하지 않아요! (함정)\n마지막 원소는 x[length(x)] 또는 tail(x, 1)로 가져와요.",
m:["x[2] → 20 (R은 1부터 시작)","x[c(1, 3)] → 10 30","x[x > 15] → 20 30 40 (조건 인덱싱)","x[-c(1, 2)] → 30 40","length(x) → 4"]},

{s:3,t:"r",q:"R에서 mean(c(1, NA, 3))의 결과는?",o:["2","4/3","NA","에러 발생"],a:2,
e:"R에서 NA(결측값)가 하나라도 있으면 mean, sum 같은 계산 결과도 NA가 돼요.\n결측값을 빼고 계산하려면 na.rm = TRUE 옵션을 줘야 해요.\nmean(c(1, NA, 3), na.rm = TRUE) → 2",
m:["NA: 결측값 (Not Available)","NaN: 정의되지 않은 수 (0/0)","NULL: 아무것도 없음 (길이 0)","Inf: 무한대 (1/0)","is.na(x): 결측 여부, sum(is.na(x)): 결측 개수"]},

{s:3,t:"r",q:"고객 데이터로 '주 구매 매장', '선호 시간대' 같은 변수를 새로 만들었다. 이런 변수는?",o:["요약변수","파생변수","더미변수","종속변수"],a:1,
e:"파생변수는 분석가가 특정 의미를 부여해서 새로 만든 변수예요. '주 구매 매장'처럼 기준을 분석가가 정하므로 주관적일 수 있어서 논리적 타당성이 필요해요.\n\n① 요약변수: 데이터를 단순 집계한 변수 (총 구매 금액, 구매 횟수, 방문 일수) → 재활용성이 높음\n③ 더미변수: 범주형을 0/1로 바꾼 변수\n④ 종속변수: 예측하려는 결과 변수",
m:["요약변수 = 객관적 집계, 재활용성 높음","파생변수 = 의미 부여, 주관적, 논리적 타당성 필요","데이터 마트: 분석 목적에 맞게 요약·파생변수를 모아 만든 데이터 집합","reshape 패키지: melt(넓은 → 긴 형태), cast(긴 → 넓은 형태)","sqldf: R에서 SQL 사용 / plyr: ddply 등 / data.table: 빠른 대용량 처리"]},

{s:3,t:"r",q:"R의 데이터 구조 중 '열마다 다른 데이터 타입'을 가질 수 있는 2차원 구조는?",o:["벡터","행렬","배열","데이터프레임"],a:3,
e:"데이터프레임은 엑셀 표처럼 행과 열이 있고, 열마다 숫자·문자·논리 등 다른 타입을 가질 수 있어요(같은 열 안은 같은 타입).\n\n다른 보기는?\n① 벡터: 1차원, 한 가지 타입만\n② 행렬: 2차원, 한 가지 타입만\n③ 배열: 3차원 이상, 한 가지 타입만\n\n서로 다른 타입을 자유롭게 담는 건 리스트.",
m:["data.frame(name = c(\"A\",\"B\"), age = c(20, 30))","df$age: 열 선택, df[1, ]: 1행 선택","head(df): 앞 6행, str(df): 구조, summary(df): 요약통계","nrow(df), ncol(df): 행·열 개수"]},

{s:3,t:"stat",q:"이항분포 B(n=10, p=0.3)의 분산은?",o:["3","2.1","0.21","0.7"],a:1,
e:"이항분포의 평균 = np, 분산 = np(1 − p)\n평균 = 10 × 0.3 = 3\n분산 = 10 × 0.3 × 0.7 = 2.1\n\n보기 3은 평균(함정), 0.21은 p(1−p).",
m:["이항분포: n번 독립 시행에서 성공 횟수 (동전 10번 던져 앞면 개수)","베르누이: n = 1인 이항분포, 평균 p, 분산 p(1−p)","포아송: 평균 = 분산 = λ","표준편차 = √분산 = √2.1 ≈ 1.45","E(aX + b) = aE(X) + b, Var(aX + b) = a²Var(X)"]},

{s:3,t:"stat",q:"모표준편차가 10이고 표본 크기가 25일 때 표본평균의 표준오차는?",o:["0.4","2","10","50"],a:1,
e:"표준오차(SE) = σ / √n = 10 / √25 = 10 / 5 = 2\n\n표준오차는 '표본평균이 진짜 평균에서 얼마나 흔들리는지'를 나타내요. 표본이 커질수록 작아져요.",
m:["표준편차: 데이터 하나하나가 퍼진 정도","표준오차: 표본평균(통계량)이 퍼진 정도 = σ/√n","표본을 4배로 늘리면 표준오차는 1/2","중심극한정리: n이 충분히 크면 표본평균은 정규분포 N(μ, σ²/n)을 따름"]},

{s:3,t:"stat",q:"신뢰구간에 대한 설명으로 옳은 것은?",o:["신뢰수준을 높이면 신뢰구간이 좁아진다","표본 크기를 늘리면 신뢰구간이 넓어진다","신뢰수준을 높이면 신뢰구간이 넓어진다","신뢰구간은 표본 크기와 관계없다"],a:2,
e:"신뢰수준을 95% → 99%로 높이면 '더 확실하게 포함'해야 하므로 구간을 더 넓게 잡아야 해요.\n표본 크기를 늘리면 정보가 많아져 구간이 좁아져요.\n\n비유: 범인이 '서울 어딘가'에 있다(넓음, 확실함) vs '강남역 근처'에 있다(좁음, 덜 확실함)",
m:["신뢰수준↑ → 구간 넓어짐","표본 크기↑ → 구간 좁아짐","95% 신뢰구간: 같은 방법으로 100번 구하면 약 95번은 모수를 포함","점추정(하나의 값) vs 구간추정(범위)","좋은 추정량 조건: 불편성, 효율성, 일치성, 충족성"]},

{s:3,t:"stat",q:"다음 중 비모수 검정이 아닌 것은?",o:["부호 검정","윌콕슨 순위합 검정","크루스칼-왈리스 검정","독립표본 t검정"],a:3,
e:"t검정은 모집단이 정규분포를 따른다는 '가정'이 필요한 모수 검정이에요.\n비모수 검정은 분포 가정 없이 데이터의 '순위'나 '부호'를 이용해요.\n\n짝 맞추기\n· 대응표본 t검정 ↔ 부호 검정, 윌콕슨 부호순위 검정\n· 독립표본 t검정 ↔ 만-위트니 U 검정 (= 윌콕슨 순위합)\n· 분산분석 ↔ 크루스칼-왈리스 검정\n· 피어슨 상관 ↔ 스피어만 순위상관",
m:["비모수 검정이 필요한 경우: 표본이 작거나, 정규성 가정이 안 맞거나, 순서형 데이터일 때","런 검정: 데이터 배열의 무작위성 검정","비모수 검정은 이상치에 강하지만 검정력이 다소 낮을 수 있어요"]},

{s:3,t:"stat",q:"A, B, C 세 반의 평균 점수가 같은지 비교할 때 알맞은 분석은?",o:["독립표본 t검정","분산분석(ANOVA)","카이제곱 검정","상관분석"],a:1,
e:"세 집단 이상의 평균을 비교할 때는 분산분석(ANOVA)을 써요.\nF = 집단 간 분산 / 집단 내 분산 → F가 크면(p < 0.05) '적어도 한 반은 평균이 다르다'.\n\nt검정을 여러 번(A-B, B-C, A-C) 하면 제1종 오류가 누적돼서 안 돼요.",
m:["일원분산분석: 독립변수(요인) 1개, 이원분산분석: 2개","ANOVA 가정: 정규성, 등분산성, 독립성","ANOVA 결과 유의 → 어느 집단이 다른지 사후검정(Tukey, Scheffe)","R: aov(score ~ class, data = df)"]},

{s:3,t:"stat",q:"검정력(Power)에 대한 설명으로 옳은 것은?",o:["귀무가설이 참일 때 채택할 확률","귀무가설이 거짓일 때 기각할 확률","제1종 오류를 범할 확률","유의수준과 같은 값"],a:1,
e:"검정력 = 1 − β = 귀무가설이 틀렸을 때 그걸 제대로 기각할 확률이에요. 실제로 차이가 있을 때 그 차이를 잡아내는 능력이라 클수록 좋아요.\n\n다른 보기는?\n① H0가 참일 때 채택할 확률 = 1 − α (신뢰수준)\n③④ 제1종 오류 확률 = 유의수준 α",
m:["α = 제1종 오류 확률 (H0 참인데 기각)","β = 제2종 오류 확률 (H0 거짓인데 채택)","검정력 = 1 − β","표본 크기를 늘리면 검정력이 높아짐"]},

{s:3,t:"reg",q:"회귀식이 '점수 = 10 + 3.5 × 공부시간'일 때 4시간 공부한 학생의 예측 점수는?",o:["14","17.5","24","40"],a:2,
e:"공부시간 = 4를 대입: 10 + 3.5 × 4 = 10 + 14 = 24\n\n해석\n· 절편(10): 공부를 0시간 했을 때 예측 점수\n· 기울기(3.5): 공부시간 1시간 증가 시 점수 3.5점 증가",
m:["R summary 출력의 Estimate 열: (Intercept) = 절편, 변수명 = 기울기","잔차 = 실제값 − 예측값 (실제 30점이면 잔차 6)","최소제곱법(OLS): 잔차제곱합이 최소가 되는 직선","표준화 회귀계수: 단위가 다른 변수들의 영향력 비교"]},

{s:3,t:"reg",q:"다중회귀에서 변수를 계속 추가하면 생기는 문제를 보정한 지표는?",o:["결정계수 R²","수정 결정계수","상관계수","VIF"],a:1,
e:"결정계수 R²는 쓸모없는 변수라도 추가하기만 하면 항상 같거나 올라가요. 그래서 변수 개수가 다른 모형을 R²로 비교하면 불공평해요.\n수정 결정계수(Adjusted R²)는 변수 개수만큼 벌점을 줘서, 도움 안 되는 변수를 넣으면 오히려 값이 떨어져요.",
m:["다중회귀 모형 비교 → 수정 결정계수, AIC, BIC","수정 결정계수 ≤ 결정계수","AIC·BIC는 작을수록 좋은 모형 (BIC가 변수 수에 더 큰 벌점)","Mallow's Cp: 변수 선택 기준"]},

{s:3,t:"reg",q:"모든 변수를 넣고 시작해서 덜 중요한 변수를 하나씩 제거하는 변수 선택법은?",o:["전진 선택법","후진 제거법","단계적 선택법","최적 부분집합법"],a:1,
e:"후진 제거법(Backward Elimination)은 전부 넣은 모형에서 시작해, 가장 덜 중요한(p-value가 크거나 AIC를 가장 많이 줄이는) 변수를 하나씩 빼는 방법이에요.\n\n다른 보기는?\n① 전진 선택법: 변수 없이 시작해 하나씩 추가\n③ 단계적 선택법: 추가와 제거를 번갈아 수행\n④ 최적 부분집합: 가능한 모든 조합을 비교",
m:["전진 선택: 한번 들어간 변수는 안 빠짐","후진 제거: 한번 빠진 변수는 다시 안 들어감","단계적: 추가·제거 모두 가능 → 가장 많이 사용","R: step(model, direction = \"backward\" / \"forward\" / \"both\")","기준: AIC 감소"]},

{s:3,t:"reg",q:"만족도(상·중·하)와 재구매 의사(1~5점 순위)의 관계를 볼 때 적합한 상관계수는?",o:["피어슨 상관계수","스피어만 상관계수","결정계수","공분산"],a:1,
e:"두 변수 모두 순서(서열)형 데이터라서, 값 자체보다 '순위'로 관계를 보는 스피어만 순위상관계수가 적합해요. 비모수 방법이라 정규성 가정도 필요 없어요.\n\n① 피어슨: 연속형(등간·비율) 변수의 '선형' 관계, 정규성 가정\n③ 결정계수: 회귀모형의 설명력\n④ 공분산: 단위에 따라 크기가 달라져 비교가 어려움",
m:["피어슨 = 연속형 · 선형 · 모수","스피어만 = 순서형 · 순위 · 비모수 · 비선형 단조 관계도 감지","상관계수 범위 −1 ~ 1","R: cor(x, y, method = \"spearman\")"]},

{s:3,t:"ts",q:"분해 시계열의 구성 요인이 아닌 것은?",o:["추세 요인","계절 요인","순환 요인","상관 요인"],a:3,
e:"분해 시계열은 시계열을 4가지 요인으로 나눠서 봐요.\n① 추세(Trend): 장기적으로 오르거나 내리는 경향\n② 계절(Seasonal): 1년 안에서 고정된 주기로 반복 (여름 아이스크림)\n③ 순환(Cyclical): 주기가 일정하지 않은 장기 변동 (경기 순환)\n④ 불규칙(Irregular): 위 요인으로 설명 안 되는 무작위 변동\n\n'상관 요인'은 없어요.",
m:["계절 요인: 주기가 알려져 있음(요일, 월, 분기)","순환 요인: 주기가 알려지지 않음, 보통 1년 이상","이동평균법: 일정 기간 평균으로 추세 파악","지수평활법: 최근 관측치에 더 큰 가중치"]},

{s:3,t:"ts",q:"시계열의 분산이 시간에 따라 커질 때 정상성을 확보하는 방법은?",o:["차분","로그 변환","이동평균 제거","계절 더미 추가"],a:1,
e:"분산이 일정하지 않을 때는 로그 변환(또는 제곱근 변환) 같은 '변환'으로 분산을 안정시켜요.\n평균이 일정하지 않을 때(추세가 있을 때)는 '차분'을 해요.\n\n정리\n· 평균 불안정 → 차분\n· 분산 불안정 → 변환\n· 계절성 → 계절 차분",
m:["정상성 조건: 평균 일정, 분산 일정, 공분산은 시차에만 의존","차분: Yt − Yt−1","ARIMA(p, d, q)의 d = 차분 횟수","정상성 검정: ADF 검정(단위근 검정)"]},

{s:3,t:"ts",q:"MA(2) 모형의 자기상관함수(ACF) 특징은?",o:["천천히 지수적으로 감소한다","시차 2 이후 0으로 절단된다","시차 2 이후 증가한다","모든 시차에서 0이다"],a:1,
e:"MA(q) 모형은 ACF가 시차 q 이후에 갑자기 0이 돼요(절단). 그래서 MA(2)는 시차 2까지만 유의하고 그 이후 절단.\n반대로 PACF는 천천히 감소해요.\n\nAR(p)는 정반대: PACF가 p 이후 절단, ACF는 천천히 감소.",
m:["AR(p): PACF p 이후 절단 / ACF 서서히 감소","MA(q): ACF q 이후 절단 / PACF 서서히 감소","ARMA(p, q): 둘 다 서서히 감소","외우는 요령: MA ↔ ACF (A가 들어간 짝), AR ↔ PACF","백색잡음: 모든 시차에서 자기상관 0"]},

{s:3,t:"ts",q:"PCA 결과에서 누적 기여율 80% 이상을 기준으로 할 때 선택할 주성분 수는?",calc:"                        Comp.1  Comp.2  Comp.3  Comp.4\nProportion of Variance   0.62    0.25    0.09    0.04\nCumulative Proportion    0.62    0.87    0.96    1.00",o:["1개","2개","3개","4개"],a:1,
e:"Cumulative Proportion(누적 기여율) 행을 봐요.\n· 1개: 62% → 80% 미만\n· 2개: 87% → 80% 이상 ✔\n그래서 주성분 2개를 선택해요. 원래 4개 변수를 2개로 줄여도 정보의 87%를 유지한다는 뜻이에요.",
m:["Proportion of Variance = 각 주성분이 설명하는 분산 비율","Standard deviation² = 고유값 (상관행렬이면 1 이상인 것 선택)","스크리 플롯: 꺾이는(elbow) 지점 직전까지","주성분 계수(loadings)로 각 주성분의 의미 해석","R: summary(princomp(x, cor = TRUE))"]},

{s:3,t:"cls",q:"의사결정나무의 장점으로 옳지 않은 것은?",o:["결과를 해석하기 쉽다","선형성·정규성 같은 가정이 필요 없다","이상치에 덜 민감하다","분리 경계 근처에서도 오류가 적다"],a:3,
e:"의사결정나무는 '나이 30 이상?'처럼 딱 잘라 나누기 때문에, 경계값 근처(29.9세 vs 30.1세)의 데이터는 오히려 오류가 생기기 쉬워요. 이게 대표적인 단점이에요.\n\n장점\n① 규칙(if-then)이라 해석이 쉬움\n② 비모수 모형이라 가정 불필요\n③ 이상치에 강함, 변수 선택이 자동으로 됨",
m:["단점: 분리 경계 근처 오류, 불안정성(데이터 조금 바뀌면 나무가 크게 변함), 변수 간 상호작용을 각각 따로 봄","불안정성 해결 → 앙상블(배깅, 랜덤 포레스트)","정지 규칙: 더 이상 분리하지 않는 조건","가지치기: 과적합 방지를 위해 불필요한 가지 제거"]},

{s:3,t:"cls",q:"의사결정나무에서 '가지치기(Pruning)'를 하는 주된 목적은?",o:["계산 속도 향상","과대적합 방지","결측치 처리","변수 표준화"],a:1,
e:"나무를 끝까지 키우면 훈련 데이터의 잡음까지 외워 과대적합이 돼요. 그래서 검증 데이터 성능을 보면서 불필요하거나 너무 세분화된 가지를 잘라내는 것이 가지치기예요.",
m:["정지 규칙: 처음부터 더 자라지 않게 하는 사전 방법 (깊이 제한, 최소 관측치 수)","가지치기: 다 키운 뒤 잘라내는 사후 방법","나무 깊이가 깊을수록 → 과대적합 위험↑","R 패키지: rpart (CART), party (ctree)"]},

{s:3,t:"cls",q:"분포가 반반(50:50)인 두 클래스 마디의 엔트로피는? (log 밑 2)",o:["0","0.5","1","2"],a:2,
e:"엔트로피 = −Σ p·log₂p\n= −(0.5 × log₂0.5 + 0.5 × log₂0.5)\n= −(0.5 × (−1) + 0.5 × (−1)) = 1\n\n두 클래스가 반반이면 가장 불확실(불순)한 상태라 엔트로피가 최댓값 1이에요. 한 클래스만 있으면 0.",
m:["엔트로피: 0(순수) ~ 1(두 클래스 반반일 때 최대)","지니 지수: 0(순수) ~ 0.5(두 클래스 반반일 때 최대)","정보 이득 = 분리 전 엔트로피 − 분리 후 엔트로피 (클수록 좋은 분리)","C4.5 / C5.0이 엔트로피(정보 이득) 사용"]},

{s:3,t:"cls",q:"SVM(서포트 벡터 머신)에 대한 설명으로 옳은 것은?",o:["가장 가까운 K개 이웃의 다수결로 분류한다","두 클래스 사이의 마진(여백)을 최대화하는 경계를 찾는다","변수들이 서로 독립이라고 가정한다","트리 구조로 규칙을 만든다"],a:1,
e:"SVM은 두 그룹을 나누는 경계선(초평면) 중에서, 양쪽 그룹과의 거리(마진)가 가장 넓은 경계를 찾아요. 경계에 가장 가까이 있는 데이터를 서포트 벡터라고 해요.\n커널 함수를 쓰면 직선으로 안 나뉘는 데이터도 고차원으로 보내 분류할 수 있어요.\n\n다른 보기는?\n① KNN  ③ 나이브 베이즈  ④ 의사결정나무",
m:["서포트 벡터 = 경계에 가장 가까운 점들, 경계를 결정","커널 트릭: 선형·다항·RBF(가우시안) 커널","장점: 고차원에서도 성능 좋음, 과적합에 강함","단점: 대용량에서 느림, 결과 해석 어려움"]},

{s:3,t:"cls",q:"KNN(K-최근접 이웃) 분류에 대한 설명으로 옳지 않은 것은?",o:["새 데이터와 가까운 K개 이웃의 다수결로 분류한다","거리 계산을 하므로 변수 표준화가 중요하다","K 값에 따라 결과가 달라질 수 있다","학습 단계에서 복잡한 모델을 미리 만들어 둔다"],a:3,
e:"KNN은 학습 단계에서 따로 모델을 만들지 않고 데이터를 저장만 해둬요. 새 데이터가 들어오면 그때 거리를 계산해서 가까운 K개 이웃을 찾아요. 그래서 '게으른 학습(Lazy Learning)'이라고 불러요.\n\n①②③은 모두 맞는 설명이에요. 단위가 다르면 거리가 왜곡되므로 표준화가 중요해요.",
m:["K가 작으면 과대적합(잡음에 민감), K가 크면 과소적합","K는 보통 홀수로 (동점 방지)","거리: 주로 유클리드","예측 시점에 계산이 많아 대용량에서 느림"]},

{s:3,t:"cls",q:"나이브 베이즈 분류기의 핵심 가정은?",o:["모든 변수가 정규분포를 따른다","주어진 클래스에서 변수들이 서로 조건부 독립이다","클래스 간 분산이 같다","데이터가 선형적으로 분리된다"],a:1,
e:"나이브(naive, 순진한)라는 이름처럼, 클래스가 주어졌을 때 각 변수가 서로 영향을 주지 않는다(조건부 독립)고 단순하게 가정해요. 현실에서는 잘 안 맞는 가정이지만 계산이 빠르고 의외로 성능이 좋아요.\n베이즈 정리 P(A|B) = P(B|A)P(A) / P(B)를 이용해요.",
m:["대표 활용: 스팸 메일 필터, 문서 분류","장점: 빠름, 적은 데이터로도 학습, 범주형 변수에 강함","단점: 변수 간 독립 가정이 깨지면 성능 저하","베이즈 정리: 사후확률 = 가능도 × 사전확률 / 증거"]},

{s:3,t:"cls",q:"단층 퍼셉트론으로 해결할 수 없어 다층 퍼셉트론(은닉층)이 필요해진 문제는?",o:["AND 문제","OR 문제","XOR 문제","NOT 문제"],a:2,
e:"XOR(배타적 논리합)은 두 입력이 다를 때만 1이 돼요. 이 경우 점들을 직선 하나로 나눌 수 없어서(선형 분리 불가) 단층 퍼셉트론으로는 못 풀어요. 은닉층을 추가한 다층 퍼셉트론으로 해결해요.\n\nAND, OR, NOT은 직선 하나로 나눌 수 있어서 단층으로도 가능해요.",
m:["신경망 구조: 입력층 → 은닉층 → 출력층","역전파: 출력 오차를 뒤로 전달하며 가중치 조정","은닉층·노드가 너무 많으면 과대적합, 기울기 소실","은닉층 노드가 너무 적으면 과소적합","신경망 단점: 해석이 어려움(블랙박스), 초기 가중치에 따라 결과가 다름"]},

{s:3,t:"cls",q:"배깅(Bagging)에 대한 설명으로 옳은 것은?",o:["틀린 데이터에 가중치를 주며 순차 학습","부트스트랩 샘플로 여러 모델을 만들어 투표·평균","하나의 데이터로 하나의 모델만 학습","변수를 줄이는 차원 축소 기법"],a:1,
e:"배깅 = Bootstrap AGGregatING\n① 원 데이터에서 복원추출로 여러 개의 부트스트랩 샘플을 만들고\n② 각 샘플로 모델을 따로(병렬로) 학습한 뒤\n③ 분류는 다수결 투표, 회귀는 평균으로 최종 결과를 내요.\n여러 모델을 합치므로 예측의 분산(불안정성)이 줄어들어요.\n\n① 은 부스팅 설명이에요.",
m:["배깅 = 병렬, 분산 감소","부스팅 = 순차, 편향 감소","랜덤 포레스트 = 배깅 + 변수 무작위 선택","OOB(Out-Of-Bag): 부트스트랩에 안 뽑힌 약 36.8% 데이터로 검증"]},

{s:3,t:"eval",q:"고객 1,000명 중 사기 고객이 10명이다. 모델이 모두 '정상'이라고 예측하면 정확도와 재현율은?",o:["정확도 99%, 재현율 0%","정확도 1%, 재현율 100%","정확도 99%, 재현율 99%","정확도 50%, 재현율 50%"],a:0,
e:"사기를 양성(Positive)으로 보면\nTP = 0 (사기를 하나도 못 잡음), FN = 10, TN = 990, FP = 0\n· 정확도 = (TP + TN) / 전체 = 990 / 1000 = 99%\n· 재현율 = TP / (TP + FN) = 0 / 10 = 0%\n\n정확도는 99%로 높아 보이지만 사기는 한 명도 못 잡은 쓸모없는 모델이에요. 불균형 데이터에서 정확도만 보면 안 되는 이유예요.",
m:["불균형 데이터 평가: 재현율, 정밀도, F1, AUC 사용","해결: 언더샘플링(다수 클래스 줄이기), 오버샘플링(소수 클래스 늘리기)","SMOTE: 소수 클래스 데이터를 합성해 늘리는 오버샘플링","분류 기준값(cut-off)을 조정하는 방법도 있음"]},

{s:3,t:"eval",q:"정밀도 0.5, 재현율 1.0일 때 F1 점수는?",o:["0.50","0.67","0.75","1.00"],a:1,
e:"F1 = 2 × 정밀도 × 재현율 / (정밀도 + 재현율)\n= 2 × 0.5 × 1.0 / (0.5 + 1.0) = 1.0 / 1.5 ≈ 0.67\n\n산술평균이었다면 0.75지만, F1은 조화평균이라 낮은 쪽(0.5)에 더 끌려가요.",
m:["F1은 정밀도·재현율의 조화평균","둘 중 하나가 0이면 F1도 0","정밀도·재현율이 같으면 F1도 그 값","Fβ: β > 1이면 재현율 중시, β < 1이면 정밀도 중시"]},

{s:3,t:"eval",q:"데이터를 K등분해 K번 돌아가며 하나를 검증용으로 쓰고 결과를 평균하는 방법은?",o:["홀드아웃","K-fold 교차검증","부트스트랩","층화 추출"],a:1,
e:"K-fold 교차검증\n① 데이터를 K개 그룹으로 나눔\n② 그중 1개를 검증용, 나머지 K−1개를 학습용으로 사용\n③ 검증용 그룹을 바꿔가며 K번 반복\n④ K번의 성능을 평균\n모든 데이터가 한 번씩 검증에 쓰여서 평가가 안정적이에요.\n\n① 홀드아웃: 한 번만 나눔 (보통 7:3)\n③ 부트스트랩: 복원추출로 샘플 생성",
m:["K는 보통 5 또는 10","LOOCV: K = 데이터 개수 (하나씩 빼서 검증)","층화 K-fold: 각 폴드의 클래스 비율을 원 데이터와 같게","홀드아웃은 빠르지만 나누는 방식에 따라 결과가 흔들림"]},

{s:3,t:"eval",q:"ROC 곡선 아래 면적(AUC)이 0.5라는 것의 의미는?",o:["완벽한 분류 모델","무작위 추측 수준의 모델","항상 반대로 예측하는 모델","재현율이 50%"],a:1,
e:"AUC 0.5는 ROC 곡선이 대각선과 같다는 뜻이에요. 동전을 던져서 분류하는 것과 같은, 아무 판별력이 없는 모델이에요.\n\nAUC 기준(대략)\n· 0.9 ~ 1.0: 매우 우수\n· 0.8 ~ 0.9: 우수\n· 0.7 ~ 0.8: 양호\n· 0.5: 무작위 수준",
m:["AUC 1 = 완벽, 0.5 = 무작위","AUC 0.5 미만 = 예측을 거꾸로 하면 더 나음","ROC: X축 1−특이도(FPR), Y축 민감도(TPR)","AUC는 분류 기준값(cut-off)과 무관하게 모델 성능 비교 가능"]},

{s:3,t:"clu",q:"점 A(2, 3)과 B(5, 7) 사이의 맨해튼 거리는?",o:["5","7","4","25"],a:1,
e:"맨해튼 거리 = |x₁ − x₂| + |y₁ − y₂|\n= |2 − 5| + |3 − 7| = 3 + 4 = 7\n\n바둑판 모양 도로를 따라 가로·세로로만 이동한 거리예요.\n\n보기 5는 유클리드 거리 √(9 + 16) = 5 (함정), 4는 체비셰프 거리 max(3, 4).",
m:["유클리드 = √Σ(차이²), 직선 거리","맨해튼 = Σ|차이|, 격자 거리","체비셰프 = max|차이|","항상 유클리드 ≤ 맨해튼"]},

{s:3,t:"clu",q:"군집분석 결과의 품질을 평가하는 실루엣 계수에 대한 설명으로 옳은 것은?",o:["0에 가까울수록 군집이 잘 나뉜 것이다","1에 가까울수록 군집이 잘 나뉜 것이다","항상 0 이상이다","군집 수가 많을수록 항상 커진다"],a:1,
e:"실루엣 계수는 −1 ~ 1 사이 값이에요.\n· 1에 가까움: 자기 군집과는 가깝고 다른 군집과는 멀어 잘 나뉨\n· 0 근처: 두 군집 경계에 걸쳐 있음\n· 음수: 잘못된 군집에 배정됨\n\n같은 군집 안 데이터끼리의 응집도와, 가장 가까운 다른 군집과의 분리도를 함께 봐요.",
m:["실루엣 계수로 최적 K 고르기 가능 (가장 높은 K)","엘보우 기법: K에 따른 군집 내 제곱합(WSS) 그래프에서 꺾이는 지점","R: cluster 패키지 silhouette()","군집 수는 분석 목적과 해석 가능성도 함께 고려"]},

{s:3,t:"clu",q:"혼합분포 군집에서 모수를 추정할 때 사용하는 알고리즘은?",o:["Apriori","EM 알고리즘","역전파","K-medoids"],a:1,
e:"혼합분포 군집은 데이터가 여러 개의 확률분포(주로 정규분포)가 섞여서 만들어졌다고 보고, 각 분포의 모수(평균, 분산, 섞인 비율)를 EM 알고리즘으로 추정해요.\n· E 단계(Expectation): 현재 모수로 각 데이터가 각 군집에 속할 확률 계산\n· M 단계(Maximization): 그 확률로 모수를 다시 추정\n두 단계를 수렴할 때까지 반복해요.",
m:["K-means는 각 데이터를 한 군집에 '확정' 배정, 혼합분포는 '확률'로 배정","혼합분포 군집 단점: 이상치에 민감, 데이터가 충분히 커야 함, 계산이 오래 걸림","Apriori = 연관분석, 역전파 = 신경망, K-medoids = 이상치에 강한 K-means 변형"]},

{s:3,t:"clu",q:"계층적 군집분석의 결과를 나무 모양으로 표현한 그림은?",o:["산점도","덴드로그램","스크리 플롯","ROC 곡선"],a:1,
e:"덴드로그램(Dendrogram)은 데이터가 어떤 순서와 거리에서 합쳐졌는지를 나무 모양으로 보여줘요. 원하는 높이에서 가로로 자르면 그 높이에서의 군집 수가 결정돼요.\n\n다른 보기는?\n① 산점도: 두 변수 관계\n③ 스크리 플롯: PCA 주성분 개수 결정\n④ ROC 곡선: 분류 모델 평가",
m:["계층적 군집: K를 미리 정할 필요 없음","병합형(Agglomerative): 하나씩 합쳐 올라감 / 분할형(Divisive): 전체에서 나눠 내려감","한번 합쳐지면 다시 나눌 수 없음","연결법: 최단, 최장, 평균, 중심, 와드","R: hclust() → plot()으로 덴드로그램, cutree()로 군집 수 지정"]},

{s:3,t:"clu",q:"두 군집에서 가장 가까운 데이터 사이의 거리를 군집 간 거리로 쓰는 연결법은?",o:["최단 연결법","최장 연결법","평균 연결법","와드 연결법"],a:0,
e:"최단 연결법(단일 연결법, Single Linkage)은 두 군집의 데이터 쌍 중 가장 가까운 거리를 군집 간 거리로 써요. 사슬처럼 길게 이어진 군집이 만들어지기 쉬워요(chaining).\n\n다른 보기는?\n② 최장(완전): 가장 먼 데이터 사이 거리 → 둥글고 조밀한 군집\n③ 평균: 모든 쌍 거리의 평균\n④ 와드: 합쳤을 때 오차제곱합 증가 최소",
m:["최단 = Single = 가장 가까운 점","최장 = Complete = 가장 먼 점","평균 = Average","중심 = Centroid = 군집 중심 사이 거리","와드 = Ward = 오차제곱합 증가 최소"]},

{s:3,t:"assoc",q:"전체 200건 거래 중 A와 B를 함께 산 거래가 30건일 때, 규칙 A → B의 지지도는?",o:["0.10","0.15","0.30","0.50"],a:1,
e:"지지도 = A와 B를 동시에 포함한 거래 / 전체 거래 = 30 / 200 = 0.15\n\n지지도는 그 조합이 전체에서 얼마나 '자주' 나타나는지를 봐요. A → B, B → A 어느 방향이든 같아요.",
m:["지지도 = P(A∩B)","신뢰도 = P(A∩B) / P(A)","향상도 = P(A∩B) / (P(A) × P(B))","최소 지지도는 Apriori에서 빈발 항목집합을 고르는 기준"]},

{s:3,t:"assoc",q:"'노트북을 산 고객이 일주일 뒤 마우스를 산다'처럼 시간 순서를 고려하는 분석은?",o:["연관규칙 분석","순차 패턴 분석","군집 분석","판별 분석"],a:1,
e:"순차 패턴(Sequential Pattern) 분석은 연관분석에 '시간 순서'를 더한 거예요. 같은 장바구니 안이 아니라, 시간이 흐르며 이어지는 구매 순서를 찾아요.\n그래서 고객을 식별할 수 있는 정보(고객 ID, 구매 시점)가 필요해요.\n\n① 일반 연관규칙: 한 번의 거래 안에서 같이 사는 것",
m:["연관분석 = 동시 구매 (장바구니 분석)","순차 패턴 = 시간 순서 구매","순차 패턴에는 고객 ID와 시간 정보 필요","활용: 다음 구매 상품 추천, 고객 이탈 경로 분석"]},

{s:3,t:"assoc",q:"연관분석의 장점으로 옳지 않은 것은?",o:["결과가 if-then 규칙이라 이해하기 쉽다","목표 변수 없이 탐색할 수 있다","계산이 간단하다","품목 수가 많아도 계산량이 거의 늘지 않는다"],a:3,
e:"품목 수가 늘어나면 가능한 조합의 수가 기하급수적으로 늘어나서 계산량이 폭증해요. 이게 연관분석의 대표적인 단점이에요. 그래서 Apriori처럼 최소 지지도로 걸러내는 방법을 써요.\n\n장점\n① if-then 규칙 → 이해 쉬움\n② 목표 변수가 없어도 됨 (비목적성, 비지도 학습)\n③ 계산 원리가 단순",
m:["단점: 품목 증가 시 계산량 폭증, 거래가 드문 품목은 규칙 발견 어려움, 너무 세분화된 품목은 의미 없는 결과","해결: 품목을 상위 범주로 묶기, 최소 지지도 설정","FP-Growth: FP-Tree 구조로 Apriori보다 빠름 (DB 스캔 2번)"]}
];
const TMAP = ['data', 'data', 'data', 'data', 'big', 'big', 'big', 'big', 'big', 'ds', 'big', 'data', 'data', 'big', 'plan', 'plan', 'method', 'method', 'method', 'method', 'method', 'discover', 'gov', 'gov', 'gov', 'gov', 'gov', 'gov', 'gov', 'plan', 'plan', 'stat', 'stat', 'stat', 'stat', 'eval', 'eval', 'eval', 'eval', 'assoc', 'assoc', 'assoc', 'assoc', 'assoc', 'reg', 'reg', 'reg', 'reg', 'reg', 'reg', 'ts', 'ts', 'ts', 'ts', 'cls', 'cls', 'cls', 'cls', 'eval', 'cls', 'clu', 'clu', 'clu', 'clu', 'clu', 'clu', 'r', 'r', 'r', 'stat', 'stat', 'eval', 'r', 'r', 'stat', 'eval', 'reg', 'cls', 'eval', 'stat'];
Q.forEach((q,i)=>q.t=TMAP[i]);
Q.push(...QX);


const SUBJ = {1:"1과목 데이터 이해", 2:"2과목 분석 기획", 3:"3과목 데이터 분석"};
const SUBJ_SHORT = {1:"1과목", 2:"2과목", 3:"3과목"};
const TOPICS = [
  {k:"data", s:1, n:"데이터와 DB"}, {k:"big", s:1, n:"빅데이터의 가치·위기"}, {k:"ds", s:1, n:"데이터 사이언스"},
  {k:"plan", s:2, n:"분석 기획·프로젝트"}, {k:"method", s:2, n:"분석 방법론"}, {k:"discover", s:2, n:"과제 발굴"}, {k:"gov", s:2, n:"마스터플랜·거버넌스"},
  {k:"r", s:3, n:"R 기초·전처리"}, {k:"stat", s:3, n:"통계·가설검정"}, {k:"reg", s:3, n:"회귀·상관"}, {k:"ts", s:3, n:"시계열·PCA·MDS"},
  {k:"cls", s:3, n:"분류·앙상블·신경망"}, {k:"eval", s:3, n:"모델 평가"}, {k:"clu", s:3, n:"군집분석"}, {k:"assoc", s:3, n:"연관분석"}
];
const TNAME = Object.fromEntries(TOPICS.map(t => [t.k, t.n]));
Q.forEach((q, i) => q.id = i);

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// wrong bank keyed by question text so it survives question reordering
const keyOf = q => q.q.slice(0, 40);
let wrongKeys = new Set(store.get("adsp-wrong2", []));
const isWrong = q => wrongKeys.has(keyOf(q));
const saveWrong = () => store.set("adsp-wrong2", [...wrongKeys]);

const defaults = { topics: TOPICS.map(t => t.k), count: 20, shuffle: true, mode: "all" };
let cfg = Object.assign({}, defaults, store.get("adsp-cfg", {}));
cfg.topics = cfg.topics.filter(k => TNAME[k]);
let order = [], pos = 0, picked = null, results = {}, view = "setup";

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pool() { return Q.filter(q => cfg.topics.includes(q.t) && (cfg.mode === "all" || isWrong(q))); }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ---------- setup ---------- */
function renderSetup() {
  view = "setup";
  $("barwrap").hidden = true; $("hint").hidden = true;
  const total = Q.length, wrongN = Q.filter(isWrong).length;
  $("score").innerHTML = `전체 문제<br><b>${total}</b>문항`;
  const subjOn = s => TOPICS.filter(t => t.s === s).every(t => cfg.topics.includes(t.k));
  const cnt = (k) => Q.filter(q => q.t === k && (cfg.mode === "all" || isWrong(q))).length;
  const p = pool().length;
  const n = cfg.count === "all" ? p : Math.min(cfg.count, p);
  $("stage").innerHTML = `<section class="card">
    <fieldset class="field"><legend>과목</legend>
      <div class="chips">${[1,2,3].map(s => `<button class="chipbtn" id="subj-${s}" data-s="${s}" aria-pressed="${subjOn(s)}">${SUBJ[s]}</button>`).join("")}</div>
    </fieldset>
    <div class="field"><div class="lab">단원 (풀고 싶은 부분만 골라도 돼요)</div>
      ${[1,2,3].map(s => `<div class="topicgroup"><h4>${SUBJ_SHORT[s]}</h4><div class="chips">${TOPICS.filter(t => t.s === s).map(t =>
        `<button class="chipbtn" id="tp-${t.k}" data-t="${t.k}" aria-pressed="${cfg.topics.includes(t.k)}">${t.n} <span class="n">${cnt(t.k)}</span></button>`).join("")}</div></div>`).join("")}
      <div class="row" style="justify-content:flex-start;gap:14px"><button class="mini" id="all-on">전체 선택</button><button class="mini" id="all-off">전체 해제</button></div>
    </div>
    <fieldset class="field"><legend>문항 수</legend>
      <div class="chips">${[10,20,30,50,"all"].map(c => `<button class="chipbtn" id="cnt-${c}" data-c="${c}" aria-pressed="${cfg.count === c}">${c === "all" ? "전부" : c + "문제"}</button>`).join("")}</div>
    </fieldset>
    <fieldset class="field"><legend>순서</legend>
      <div class="chips"><button class="chipbtn" id="ord-mix" data-o="1" aria-pressed="${cfg.shuffle}">섞어서</button><button class="chipbtn" id="ord-seq" data-o="0" aria-pressed="${!cfg.shuffle}">순서대로</button></div>
    </fieldset>
    <fieldset class="field"><legend>문제 범위</legend>
      <div class="chips"><button class="chipbtn" id="mode-all" data-m="all" aria-pressed="${cfg.mode === "all"}">모든 문제</button><button class="chipbtn" id="mode-wrong" data-m="wrong" aria-pressed="${cfg.mode === "wrong"}">오답노트만 <span class="n">${wrongN}</span></button></div>
    </fieldset>
    <p class="avail" style="margin:0">선택한 범위에 <b>${p}</b>문제가 있어요${p ? ` · 이번에 <b>${n}</b>문제를 풀어요` : ""}.</p>
    <div class="row"><button class="btn primary" id="start" ${p ? "" : "disabled"}>${p ? n + "문제 시작하기" : cfg.mode === "wrong" ? "선택한 단원에 오답이 없어요" : "단원을 하나 이상 골라주세요"}</button></div>
    ${wrongN ? `<div class="row" style="justify-content:flex-end"><button class="mini danger" id="clear-wrong">오답노트 비우기</button></div>` : ""}
  </section>`;

  const save = () => { store.set("adsp-cfg", cfg); renderSetup(); };
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    const s = +b.dataset.s, ks = TOPICS.filter(t => t.s === s).map(t => t.k);
    cfg.topics = subjOn(s) ? cfg.topics.filter(k => !ks.includes(k)) : [...new Set([...cfg.topics, ...ks])]; save(); });
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const k = b.dataset.t; cfg.topics = cfg.topics.includes(k) ? cfg.topics.filter(x => x !== k) : [...cfg.topics, k]; save(); });
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { cfg.count = b.dataset.c === "all" ? "all" : +b.dataset.c; save(); });
  document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { cfg.shuffle = b.dataset.o === "1"; save(); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { cfg.mode = b.dataset.m; save(); });
  $("all-on").onclick = () => { cfg.topics = TOPICS.map(t => t.k); save(); };
  $("all-off").onclick = () => { cfg.topics = []; save(); };
  $("start").onclick = () => startRound(pool().map(q => q.id));
  const cw = $("clear-wrong");
  if (cw) cw.onclick = () => {
    if (cw.dataset.armed) { wrongKeys.clear(); saveWrong(); if (cfg.mode === "wrong") cfg.mode = "all"; save(); return; }
    cw.dataset.armed = "1"; cw.textContent = "정말 비울까요? 한 번 더 누르면 비워져요";
  };
}

/* ---------- quiz ---------- */
function startRound(ids, keepOrder) {
  let list = ids.slice();
  if (cfg.shuffle && !keepOrder) shuffle(list);
  if (!keepOrder && cfg.count !== "all") list = list.slice(0, cfg.count);
  order = list; pos = 0; picked = null; results = {};
  view = "quiz"; $("barwrap").hidden = false; $("hint").hidden = false;
  render(); window.scrollTo({ top: 0 });
}

function updateScore() {
  const done = Object.keys(results).length, ok = Object.values(results).filter(Boolean).length;
  $("score").innerHTML = done ? `맞힌 문제<br><b>${ok}</b> / ${done}` : `이번 회차<br><b>${order.length}</b>문항`;
  $("bar").style.width = order.length ? (done / order.length * 100) + "%" : "0";
}

const NUM = ["①", "②", "③", "④"];
function render() {
  updateScore();
  if (pos >= order.length) return renderResult();
  const q = Q[order[pos]];
  $("stage").innerHTML = `<section class="card" aria-live="polite">
    <div class="meta"><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${SUBJ_SHORT[q.s]}</span><span class="tag t2">${TNAME[q.t]}</span></span><span class="qnum">${pos + 1} / ${order.length}</span></div>
    <p class="q">${esc(q.q)}${q.calc ? `<span class="calc">${esc(q.calc)}</span>` : ""}</p>
    <div class="opts">${q.o.map((t, i) => `<button class="opt" id="opt-${i}" data-i="${i}"><span class="bub">${i + 1}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div id="exp"></div>
    <div class="row" id="quitrow"><button class="btn small" id="quit">그만 풀고 결과 보기</button></div>
  </section>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i));
  $("quit").onclick = () => { order = order.slice(0, pos + (picked !== null ? 1 : 0)); pos = order.length; picked = null; render(); };
}

function choose(i) {
  if (picked !== null) return;
  picked = i;
  const q = Q[order[pos]], ok = i === q.a;
  results[q.id] = ok;
  if (ok) wrongKeys.delete(keyOf(q)); else wrongKeys.add(keyOf(q));
  saveWrong();
  document.querySelectorAll(".opt").forEach(b => {
    const k = +b.dataset.i; b.disabled = true;
    if (k === q.a) b.classList.add("right"); else if (k === i) b.classList.add("wrong");
  });
  const last = pos === order.length - 1;
  $("exp").innerHTML = `<div class="exp">
    <div class="verdict ${ok ? "ok" : "no"}">${ok ? "정답이에요!" : "아쉬워요, 틀렸어요"}</div>
    <p class="ans">정답 ${NUM[q.a]} ${esc(q.o[q.a])}${ok ? "" : ` <span style="color:var(--ink-soft);font-weight:500">· 오답노트에 저장했어요</span>`}</p>
    <div class="sec"><h3>해설</h3><p class="why">${esc(q.e)}</p></div>
    ${q.m ? `<div class="sec more"><h3>함께 알아두기</h3><ul>${q.m.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <div class="row" style="margin-top:4px"><button class="btn primary" id="next">${last ? "결과 보기" : "다음 문제"}</button></div>
  </div>`;
  $("next").onclick = next; $("next").focus({ preventScroll: true });
  updateScore();
}
function next() { pos++; picked = null; render(); window.scrollTo({ top: 0 }); }

/* ---------- result ---------- */
function renderResult() {
  view = "result"; $("hint").hidden = true;
  const ids = Object.keys(results).map(Number);
  if (!ids.length) return renderSetup();
  const ok = ids.filter(id => results[id]).length;
  const pct = Math.round(ok / ids.length * 100);
  const bySub = [1, 2, 3].map(s => {
    const xs = ids.filter(id => Q[id].s === s), c = xs.filter(id => results[id]).length;
    return { s, n: xs.length, c, p: xs.length ? Math.round(c / xs.length * 100) : null };
  });
  const byTopic = TOPICS.map(t => {
    const xs = ids.filter(id => Q[id].t === t.k), c = xs.filter(id => results[id]).length;
    return { ...t, n: xs.length, c, p: xs.length ? Math.round(c / xs.length * 100) : null };
  }).filter(t => t.n).sort((a, b) => a.p - b.p);
  const wrongNow = ids.filter(id => !results[id]);
  const msg = pct >= 60 ? "합격선(60점) 이상이에요. 약한 단원만 한 번 더 보면 좋아요." : "아직 합격선(60점) 아래예요. 아래 약한 단원부터 다시 풀어보세요.";
  $("stage").innerHTML = `<section class="card result">
    <h2>이번 회차 결과</h2>
    <div><span class="big">${pct}</span><span style="color:var(--ink-soft)"> 점 (${ok} / ${ids.length})</span></div>
    <p style="margin:0">${msg}</p>
    <div class="subjects">${bySub.map(b => `<div class="sbox">${SUBJ[b.s]}<b>${b.p === null ? "-" : b.p + "%"}</b>${b.p === null ? '<span style="color:var(--ink-soft)">안 풀었음</span>' : b.p >= 40 ? '<span class="pass">과락 통과</span>' : '<span class="fail">과락 위험 (40% 미만)</span>'}</div>`).join("")}</div>
    <div class="field"><div class="lab">단원별 정답률 (낮은 순)</div><div class="tlist">${byTopic.map(t =>
      `<div class="trow"><span>${t.n}</span><span class="tb"><i style="width:${t.p}%;background:${t.p >= 60 ? "var(--ok)" : "var(--bad)"}"></i></span><span class="pc">${t.c}/${t.n}</span></div>`).join("")}</div></div>
    <div class="row">
      ${wrongNow.length ? `<button class="btn primary" id="retry-now">이번에 틀린 ${wrongNow.length}문제 다시 풀기</button>` : ""}
      <button class="btn" id="to-setup">범위 다시 고르기</button>
    </div>
  </section>`;
  $("score").innerHTML = `이번 회차<br><b>${ok}</b> / ${ids.length}`;
  $("bar").style.width = "100%";
  if (wrongNow.length) $("retry-now").onclick = () => startRound(wrongNow, true);
  $("to-setup").onclick = () => { renderSetup(); window.scrollTo({ top: 0 }); };
}

document.addEventListener("keydown", e => {
  if (view !== "quiz") return;
  if (picked === null && /^[1-4]$/.test(e.key) && pos < order.length) choose(+e.key - 1);
  else if (picked !== null && e.key === "Enter" && document.activeElement?.id !== "next") next();
});

renderSetup();
</script>
</body>
</html>
