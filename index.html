<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>ADsP 한 문제씩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like an exam booklet page; OMR-style answer bubbles in sheet red */
:root {
  --paper: #f6f7fa;
  --sheet: #ffffff;
  --ink: #1b2340;
  --ink-soft: #5b6380;
  --line: #dde1ea;
  --omr: #d6345a;
  --omr-soft: #fbe6ec;
  --ok: #1f8a57;
  --ok-soft: #e3f4ea;
  --bad: #c23a3a;
  --bad-soft: #fbe7e7;
  --note: #f3f5fb;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11141d; --sheet: #191d29; --ink: #e8ebf4; --ink-soft: #9aa2bd; --line: #2c3245;
  --omr: #ff6f8f; --omr-soft: #3a1f29; --ok: #4fc68a; --ok-soft: #173326; --bad: #ff7a7a; --bad-soft: #3a1d1f; --note: #20253a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11141d; --sheet: #191d29; --ink: #e8ebf4; --ink-soft: #9aa2bd; --line: #2c3245;
  --omr: #ff6f8f; --omr-soft: #3a1f29; --ok: #4fc68a; --ok-soft: #173326; --bad: #ff7a7a; --bad-soft: #3a1d1f; --note: #20253a;
  color-scheme: dark; }

body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 em { font-style: normal; color: var(--omr); }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 13.5px; }
.score { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); text-align: right; }
.score b { color: var(--ink); font-size: 20px; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; }

/* setup */
.field { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field > legend, .field > .lab { font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; padding: 0; margin-bottom: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { border: 1px solid var(--line); background: var(--sheet); color: var(--ink-soft); font: 500 14px var(--f-body);
  padding: 7px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn .n { font-family: var(--f-mono); font-size: 12px; opacity: .75; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chipbtn:disabled { opacity: .4; cursor: default; }
.topicgroup { display: flex; flex-direction: column; gap: 6px; }
.topicgroup h4 { margin: 0; font-size: 12.5px; color: var(--omr); font-weight: 700; display: flex; gap: 10px; align-items: center; }
.mini { background: none; border: 0; color: var(--ink-soft); font: 500 12px var(--f-body); text-decoration: underline; cursor: pointer; padding: 0; }
.avail { font-size: 14px; color: var(--ink-soft); }
.avail b { color: var(--ink); font-family: var(--f-mono); }
.danger { color: var(--bad); }

.tab:focus-visible, .opt:focus-visible, .btn:focus-visible, .chipbtn:focus-visible, .mini:focus-visible { outline: 3px solid var(--omr); outline-offset: 2px; }

.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--omr); transition: width .3s; }

.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
.tag { font-weight: 700; color: var(--omr); background: var(--omr-soft); padding: 2px 9px; border-radius: 4px; letter-spacing: .02em; }
.tag.t2 { color: var(--ink-soft); background: var(--note); font-weight: 500; }
.qnum { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.q { font-size: 18px; font-weight: 500; margin: 0; white-space: pre-line; }
.q .calc { display: block; margin-top: 8px; font-family: var(--f-mono); font-size: 13.5px; background: var(--note); padding: 10px 12px; border-radius: 6px; white-space: pre; overflow-x: auto; font-weight: 500; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px;
  font: 400 15.5px/1.5 var(--f-body); cursor: pointer; transition: border-color .15s, background .15s; }
.opt span:last-child { min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--omr); }
.bub { width: 26px; height: 32px; border: 1.5px solid var(--omr); border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 13px; color: var(--omr); justify-self: center; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .bub { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bub { border-color: var(--bad); background: var(--bad); color: var(--sheet); }

.exp { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-family: var(--f-display); font-size: 22px; }
.verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }
.exp p { margin: 0; }
.exp .ans { font-weight: 700; }
.exp .why { white-space: pre-line; font-size: 15px; }
.sec { background: var(--note); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-x: auto; }
.sec h3 { margin: 0; font-size: 12.5px; letter-spacing: .06em; color: var(--ink-soft); font-weight: 700; }
.sec.more { background: var(--sheet); border: 1px solid var(--line); border-left: 3px solid var(--omr); }
.sec.more h3 { color: var(--omr); }
.sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }

.row { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.btn { font: 700 15px var(--f-body); padding: 11px 18px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); flex: 1; }
.btn.primary:disabled { opacity: .4; cursor: default; }
.btn.small { font-size: 13px; padding: 7px 12px; font-weight: 500; }
.hint { font-size: 12.5px; color: var(--ink-soft); text-align: center; margin: 0; }

.result h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; }
.big { font-family: var(--f-mono); font-size: 44px; font-variant-numeric: tabular-nums; line-height: 1; }
.subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 480px) { .subjects { grid-template-columns: 1fr; } }
.sbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.sbox b { display: block; font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
.tlist { display: flex; flex-direction: column; gap: 6px; }
.trow { display: grid; grid-template-columns: 1fr 90px 52px; gap: 10px; align-items: center; font-size: 14px; }
.trow .tb { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.trow .tb i { display: block; height: 100%; }
.trow .pc { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ADsP <em>한 문제씩</em></h1>
      <p class="sub">범위·문항 수를 고르고, 한 문제 풀 때마다 해설 확인</p>
    </div>
    <div class="score" id="score"></div>
  </header>
  <div class="bar" aria-hidden="true" id="barwrap" hidden><i id="bar"></i></div>
  <main id="stage"></main>
  <p class="hint" id="hint" hidden>키보드: 1~4로 선택 · Enter로 다음 문제</p>
</div>

<script>
const Q = [
// ===================== 1과목 =====================
{s:1,q:"SECI 모델에서 개인의 노하우(암묵지)를 문서나 매뉴얼(형식지)로 만드는 과정은?",o:["공통화","표출화","연결화","내면화"],a:1,
e:"머릿속에만 있던 지식(암묵지)을 '밖으로 꺼내서' 글·매뉴얼(형식지)로 만드는 단계가 표출화(Externalization)예요.\n\n다른 보기는?\n① 공통화: 암묵지 → 암묵지. 옆에서 보고 따라 하며 배움 (도제식 교육)\n③ 연결화: 형식지 → 형식지. 여러 문서를 합쳐 새 문서를 만듦\n④ 내면화: 형식지 → 암묵지. 매뉴얼을 보고 연습해서 몸에 익힘",
m:["순서: 공통화 → 표출화 → 연결화 → 내면화 (S-E-C-I), 이 순환이 반복되며 지식이 커져요","암묵지: 개인의 경험·노하우, 공유가 어려움 (예: 김치 손맛, 자전거 타는 법)","형식지: 문서·매뉴얼·DB처럼 형태가 있어 공유가 쉬움","시험은 '예시 상황 → 어느 단계?' 형태로 많이 나와요. 화살표 방향(무엇에서 무엇으로)만 보면 풀려요"]},

{s:1,q:"DIKW 피라미드에서 'A마트 연필이 B마트보다 싸다'는 어디에 해당할까?",o:["데이터","정보","지식","지혜"],a:1,
e:"'A마트 연필 500원', 'B마트 연필 300원'은 각각 데이터예요. 이 두 데이터를 '비교'해서 관계와 의미가 생긴 것이 정보입니다.\n\n다른 보기는?\n① 데이터: 가공 전 사실 하나하나 (A마트 500원)\n③ 지식: 정보를 바탕으로 내린 판단 (B마트에서 사야겠다)\n④ 지혜: 지식을 응용한 창의적 아이디어 (B마트는 다른 문구도 쌀 것이다)",
m:["DIKW 순서: Data → Information → Knowledge → Wisdom","데이터: 객관적 사실, 다른 데이터와의 관계가 없음","정보: 데이터를 가공·처리해 관계와 의미를 부여","지식: 정보를 구조화하고 내 경험과 결합 / 지혜: 지식을 바탕으로 한 아이디어, 근본 원리 이해","판별 요령: '비교·관계' → 정보, '내 행동 결정' → 지식, '다른 곳에 응용' → 지혜"]},

{s:1,q:"데이터베이스의 정의(특징)로 옳지 않은 것은?",o:["통합된 데이터","저장된 데이터","공용 데이터","고정된 데이터"],a:3,
e:"DB의 데이터는 새로 들어오고, 고쳐지고, 지워지면서 항상 바뀌어요. 그래서 '고정된'이 아니라 '변화되는 데이터'가 맞아요.\n\n정답 보기들의 뜻\n① 통합된 데이터: 같은 데이터가 중복되지 않음\n② 저장된 데이터: 컴퓨터 저장 매체에 저장됨\n③ 공용 데이터: 여러 사용자가 함께 이용",
m:["DB 정의 4가지: 통합 · 저장 · 공용 · 변화","DB의 일반적 특징: 정보의 축적·전달 측면, 이용 측면(다양한 방법으로 검색), 기업 경영 측면, 산업 발전 측면","DBMS: DB를 관리하는 소프트웨어 (Oracle, MySQL 등)","메타데이터 = 데이터에 대한 데이터 / 인덱스 = 검색을 빠르게 하는 색인","SQL 분류: DDL(CREATE, ALTER, DROP) · DML(SELECT, INSERT, UPDATE, DELETE) · DCL(GRANT, REVOKE)"]},

{s:1,q:"데이터 웨어하우스(DW)의 특징이 아닌 것은?",o:["주제 지향적","통합적","시계열적","휘발적"],a:3,
e:"DW는 분석용으로 데이터를 쌓아두는 창고라서, 한번 적재된 데이터는 수정·삭제 없이 읽기 위주로 쓰여요. 이걸 '비휘발적'이라고 해요. '휘발적'이 틀린 보기입니다.\n\n정답 보기들의 뜻\n① 주제 지향적: 업무(주문 처리)가 아니라 주제(고객, 상품) 중심으로 정리\n② 통합적: 여러 시스템의 데이터를 일관된 형식으로 통합\n③ 시계열적: 과거부터 현재까지 시간 흐름에 따른 이력 보관",
m:["DW 특징 4가지: 주제 지향 · 통합 · 시계열 · 비휘발","데이터 마트(DM): DW의 일부, 특정 부서·목적용 소규모 DW","ETL: 원천 데이터를 추출(Extract) → 변환(Transform) → 적재(Load) 해서 DW에 넣는 과정","OLTP(실시간 거래 처리, 운영계) vs OLAP(다차원 분석 처리, DW 기반)"]},

{s:1,q:"빅데이터가 가져온 변화로 옳지 않은 것은?",o:["사전 처리 → 사후 처리","표본 조사 → 전수 조사","질 → 양","상관관계 → 인과관계"],a:3,
e:"방향이 거꾸로예요. 빅데이터 시대에는 '왜 그런지(인과)'를 밝히기보다 '같이 움직이는지(상관)'만 알아도 충분히 활용할 수 있다고 봐서 인과관계 → 상관관계로 바뀌었어요.\n\n정답 보기들의 뜻\n① 사후 처리: 필요한 것만 골라 저장(사전)하지 않고 일단 다 모은 뒤 분석\n② 전수 조사: 저장·처리 비용이 낮아져 전체 데이터를 분석\n③ 질 → 양: 데이터가 충분히 많으면 일부 오류가 있어도 결과에 큰 영향이 없음",
m:["4대 변화: 사전처리→사후처리 · 표본조사→전수조사 · 질→양 · 인과관계→상관관계","빅데이터 3V: Volume(규모) · Variety(다양성) · Velocity(속도) (+ Value, Veracity)","출현 배경: 산업계(고객 데이터 축적), 학계(거대 데이터 연구), 기술(저장장치 가격 하락, 클라우드, 모바일)","빅데이터 비유: 석탄·철 / 원유(생산성) / 렌즈(새로운 시각) / 플랫폼(공동 활용 기반)"]},

{s:1,q:"범죄를 저지를 것이라는 '예측'만으로 사람을 처벌하는 위험(책임 원칙 훼손)에 대한 통제 방안은?",o:["동의제를 책임제로 전환","결과 기반 책임 원칙 고수","알고리즈미스트 도입","데이터 마스킹"],a:1,
e:"예측은 아직 일어나지 않은 일이에요. 예측 결과만으로 불이익을 주면 안 되고, 실제로 한 행동의 '결과'에 대해서만 책임을 물어야 한다는 것이 결과 기반 책임 원칙입니다.\n\n다른 보기는?\n① 동의제 → 책임제: '사생활 침해'의 통제 방안\n③ 알고리즈미스트: '데이터 오용'의 통제 방안\n④ 데이터 마스킹: 비식별화 기법 중 하나",
m:["위기 요인 ↔ 통제 방안 (3쌍 통째로 외우기)","사생활 침해 → 개인정보 제공자의 '동의'에서 사용자의 '책임'으로","책임 원칙 훼손 → 결과 기반 책임 원칙 고수","데이터 오용 → 알고리즘 접근 허용, 알고리즈미스트","영화 '마이너리티 리포트'가 책임 원칙 훼손의 대표 예시로 자주 언급돼요"]},

{s:1,q:"알고리즘의 잘못된 판단으로 피해를 본 사람을 위해 알고리즘을 해석하고 구제하는 전문가는?",o:["데이터 엔지니어","데이터 스튜어드","알고리즈미스트","DBA"],a:2,
e:"데이터 오용(잘못된 데이터나 알고리즘으로 인한 피해)을 막기 위해, 알고리즘을 해석해 주고 부당하게 피해 본 사람을 구제하는 전문가가 알고리즈미스트(Algorithmist)예요.\n\n다른 보기는?\n① 데이터 엔지니어: 데이터 수집·저장 파이프라인 구축\n② 데이터 스튜어드: 데이터 품질·표준을 관리하는 담당자 (데이터 거버넌스)\n④ DBA: 데이터베이스 관리자",
m:["데이터 오용의 통제 방안 = '알고리즘 접근 허용' + 알고리즈미스트","알고리즈미스트는 빅데이터의 미래 '인력' 요소로도 등장 (데이터 사이언티스트와 함께)","빅데이터 미래 3요소: 데이터(모든 것의 데이터화) · 기술(진화하는 알고리즘, AI) · 인력(데이터 사이언티스트, 알고리즈미스트)"]},

{s:1,q:"빅데이터의 가치를 측정하기 어려운 이유가 아닌 것은?",o:["데이터의 재사용·재조합·다목적 개발","기존에 없던 새로운 가치 창출","분석 기술의 발전","저장 장치 가격의 하락"],a:3,
e:"저장 장치 가격이 내려간 건 빅데이터가 '등장한 배경(기술 발전)'이지, 가치를 측정하기 어려운 이유가 아니에요.\n\n정답 보기들의 뜻\n① 활용 방식의 다양화: 누가, 언제, 어디에 쓸지 몰라서 가치를 미리 매길 수 없음\n② 새로운 가치 창출: 기존에 없던 가치라 비교 기준이 없음\n③ 분석 기술 발전: 지금은 쓸모없는 데이터도 나중에 새 기술로 가치가 생길 수 있음",
m:["가치 측정이 어려운 이유 3가지: 데이터 활용 방식(재사용·재조합·다목적 개발) · 새로운 가치 창출 · 분석 기술의 발전","데이터 재조합 = 매시업(Mashup)","빅데이터 출현 배경: 산업계(고객 데이터 축적) · 학계(거대 데이터 활용 과학 확산) · 관련 기술 발전(디지털화, 저장 기술, 인터넷, 모바일)"]},

{s:1,q:"'택배 차량을 어떻게 배치해야 가장 효율적일까?'에 적합한 빅데이터 활용 기법은?",o:["연관규칙 학습","유전 알고리즘","감정 분석","소셜 네트워크 분석"],a:1,
e:"'가장 효율적인(최적의) 방법'을 찾는 문제예요. 유전 알고리즘은 생물의 진화(선택·교배·돌연변이)를 흉내 내서 여러 해를 세대마다 개선해 최적해를 찾는 기법입니다.\n\n다른 보기는?\n① 연관규칙: 같이 일어나는 것 찾기 (커피 사는 사람이 탄산음료도 사나?)\n③ 감정 분석: 글의 긍정·부정 판단 (신상품 반응은?)\n④ SNA: 사람 간 관계·영향력 (고객 중 영향력자는?)",
m:["7가지 기본 테크닉과 대표 질문을 짝으로 외우기","유형분석(분류): 이 사용자는 어떤 집단에 속하나?","기계학습: 기존 시청 기록으로 볼 만한 영화 추천","회귀분석: 나이가 구매 차량 타입에 어떤 영향을 주나?","'최적화·효율·배치·스케줄' 키워드 → 유전 알고리즘"]},

{s:1,q:"데이터 사이언티스트의 역량 중 Hard Skill에 해당하는 것은?",o:["스토리텔링","커뮤니케이션","분석 기술의 숙련도","창의적 사고"],a:2,
e:"Hard Skill은 배워서 익히는 '기술적 지식'이에요. 빅데이터 이론적 지식, 분석 기술의 숙련도가 여기에 해당합니다.\n\n다른 보기는? (모두 Soft Skill)\n① 스토리텔링: 설득력 있는 전달\n② 커뮤니케이션: 다분야 간 협력\n④ 창의적 사고: 통찰력 있는 분석",
m:["Hard Skill: 빅데이터 관련 이론적 지식, 분석 기술 숙련도 (통계, 머신러닝, 프로그래밍)","Soft Skill 3개: 통찰력 있는 분석(창의적 사고, 호기심, 논리적 비판) · 설득력 있는 전달(스토리텔링, 시각화) · 다분야 간 협력(커뮤니케이션)","가트너가 본 역량: 데이터 관리 · 분석 모델링 · 비즈니스 분석 · 소프트 스킬","데이터 사이언티스트는 '가설 검정'보다 '가설 설정·스토리텔링' 같은 소프트 스킬이 더 강조돼요"]},

{s:1,q:"'나이 27세 → 20대'처럼 바꾸는 개인정보 비식별화 기법은?",o:["가명처리","총계처리","범주화","데이터 마스킹"],a:2,
e:"정확한 값(27)을 구간(20대)으로 묶어서 누군지 알아보기 어렵게 만드는 것이 범주화(데이터 범주화)예요.\n\n다른 보기는?\n① 가명처리: 홍길동 → 임꺽정 (다른 값으로 대체)\n② 총계처리: 개별 값 대신 합계·평균만 공개 (키 평균 170)\n④ 데이터 마스킹: 홍길동 → 홍**, 010-1234-**** (일부를 가림)",
m:["비식별화 5가지: 가명처리 · 총계처리 · 데이터값 삭제 · 범주화 · 데이터 마스킹","데이터값 삭제: 주민번호처럼 식별 가능한 열 자체를 지움","범주화 예: 나이 → 연령대, 소득 → 소득 구간, 주소 → 시·도","가명정보(추가 정보 없이 특정 개인을 알아볼 수 없게 처리)는 통계·연구 목적으로 동의 없이 활용 가능 (데이터 3법)"]},

{s:1,q:"고객 정보를 통합 관리해 마케팅과 고객 유지에 활용하는 시스템은?",o:["ERP","SCM","CRM","KMS"],a:2,
e:"CRM(Customer Relationship Management, 고객관계관리)은 고객 데이터를 모아 우수 고객 관리, 이탈 방지, 맞춤 마케팅에 쓰는 시스템이에요.\n\n다른 보기는?\n① ERP: 전사적 자원관리. 인사·재무·생산·물류를 하나로 통합\n② SCM: 공급망 관리. 원자재 조달 → 생산 → 유통 흐름 최적화\n④ KMS: 지식관리시스템. 사내 지식 공유",
m:["BI(Business Intelligence): 데이터 기반 리포트·대시보드로 의사결정 지원","BA(Business Analytics): BI보다 한 단계 위, 통계·예측 분석으로 미래까지 봄","EAI: 기업 내 여러 시스템을 연결해 데이터를 주고받게 하는 통합 솔루션","RTE(실시간 기업): 최신 정보로 즉시 대응","OLTP = 운영(거래) 처리, OLAP = 다차원 분석 처리"]},

{s:1,q:"다음 중 반정형 데이터에 해당하는 것은?",o:["엑셀 표","JSON 파일","녹음 파일","사진"],a:1,
e:"반정형 데이터는 표(행·열) 형태는 아니지만, 태그나 키 같은 '구조 정보(메타데이터)'를 데이터 안에 함께 가지고 있어요. JSON의 {\"이름\": \"홍길동\"} 같은 형태가 대표적입니다.\n\n다른 보기는?\n① 엑셀 표: 행과 열이 고정된 정형 데이터\n③ 녹음 파일, ④ 사진: 구조가 없는 비정형 데이터",
m:["정형: RDB 테이블, 엑셀, CSV → 고정된 스키마","반정형: XML, JSON, HTML, 로그, 센서 데이터 → 스키마가 데이터 안에 포함","비정형: 텍스트 문서, 이미지, 영상, 음성, SNS 글","저장·분석 난이도: 정형 < 반정형 < 비정형","데이터 양으로는 비정형이 가장 많아요"]},

{s:1,q:"빅데이터를 '렌즈'에 비유한 이유로 가장 적절한 것은?",o:["산업 생산성을 높이는 원료라서","현미경처럼 이전에 보지 못한 것을 보여주어서","다른 서비스가 그 위에서 만들어져서","저장 비용이 싸서"],a:1,
e:"현미경이 미생물을 보게 해 생물학을 바꿨듯, 빅데이터가 이전에 보지 못한 패턴을 보여준다는 의미예요. 대표 예시는 구글 Ngram Viewer(책 속 단어 사용 빈도 변화)입니다.\n\n다른 보기는?\n① 원유·석탄·철 비유: 산업 생산성을 높이는 핵심 자원\n③ 플랫폼 비유: 여러 사람이 그 위에서 서비스를 만드는 기반 (예: 페이스북 오픈 API)",
m:["산업혁명의 석탄·철 → 혁명적 변화를 일으키는 원동력","21세기의 원유 → 생산성 향상, 새로운 범주의 산업 창출","렌즈 → 새로운 관점·발견 (구글 Ngram Viewer)","플랫폼 → 공동 활용 목적의 기반 (페이스북, 카카오)"]},

// ===================== 2과목 =====================
{s:2,q:"분석 대상(What)은 알지만 분석 방법(How)을 모를 때의 분석 주제 유형은?",o:["최적화","솔루션","통찰","발견"],a:1,
e:"'무엇을 풀어야 하는지(대상)'는 아는데 '어떻게 풀지(방법)'를 모르니, 해결 방법을 찾아내야 해요. 그래서 솔루션(Solution)입니다.\n\n다른 보기는?\n① 최적화: 대상도 알고 방법도 앎 → 기존 방식을 더 개선\n③ 통찰: 방법은 아는데 대상을 모름 → 그 방법으로 새로운 인사이트 도출\n④ 발견: 둘 다 모름 → 새로운 문제 자체를 찾아냄",
m:["표로 기억하기 (대상 / 방법)","앎 / 앎 → 최적화 (Optimization)","앎 / 모름 → 솔루션 (Solution)","모름 / 앎 → 통찰 (Insight)","모름 / 모름 → 발견 (Discovery)","대상을 아는 경우(최적화·솔루션)는 하향식, 대상을 모르는 경우(통찰·발견)는 상향식과 연결돼요"]},

{s:2,q:"분석 대상과 분석 방법을 모두 모를 때의 분석 주제 유형은?",o:["최적화","솔루션","통찰","발견"],a:3,
e:"뭘 분석해야 하는지도, 어떻게 해야 하는지도 모르니 데이터를 탐색하며 새로운 문제와 기회를 '발견'해야 해요.\n\n다른 보기는?\n① 최적화: 둘 다 앎\n② 솔루션: 대상만 앎\n③ 통찰: 방법만 앎",
m:["발견형 과제는 주로 상향식 접근(데이터 → 문제)으로 진행","상향식 도구: 디자인 사고(발산 → 수렴), 비지도 학습(군집, 연관분석), 프로토타이핑","분석 기획의 3요소 관점: 분석 대상(What)과 분석 방법(How)"]},

{s:2,q:"KDD 분석 방법론의 순서로 옳은 것은?",o:["선택 → 전처리 → 변환 → 마이닝 → 해석/평가","전처리 → 선택 → 변환 → 마이닝 → 해석/평가","선택 → 변환 → 전처리 → 마이닝 → 해석/평가","업무이해 → 선택 → 전처리 → 마이닝 → 평가"],a:0,
e:"데이터를 먼저 고르고(선택), 잡음·결측치를 다듬고(전처리), 분석하기 좋게 바꾼 다음(변환), 패턴을 캐내고(마이닝), 결과를 해석·평가해요.\n\n각 단계에서 하는 일\n· 선택: 분석 목표 설정, 데이터셋 선택\n· 전처리: 잡음, 이상치, 결측치 처리\n· 변환: 변수 선택, 차원 축소, 학습용/검증용 데이터 분리\n· 마이닝: 분석 기법 선택, 알고리즘 적용\n· 해석/평가: 결과 해석, 활용 방안\n\n④처럼 '업무 이해'가 들어가면 CRISP-DM이에요.",
m:["KDD 5단계: 선택 → 전처리 → 변환 → 마이닝 → 해석·평가","'학습용·검증용 데이터 분리'는 KDD의 '변환' 단계 (단골 함정)","CRISP-DM 6단계: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개","KDD = Knowledge Discovery in Databases (1996, Fayyad)"]},

{s:2,q:"CRISP-DM의 마지막 단계는?",o:["평가","모델링","전개","해석"],a:2,
e:"CRISP-DM은 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개, 6단계예요. 마지막 '전개(Deployment)'에서 모델을 실제 업무에 적용하고 모니터링·유지보수 계획과 최종 보고서를 작성합니다.\n\n다른 보기는?\n① 평가: 5단계. 모델이 '프로젝트 목적'에 맞는지 평가\n② 모델링: 4단계\n④ 해석: KDD의 마지막 단계(해석·평가)",
m:["각 단계 대표 작업","업무 이해: 업무 목적 파악, 상황 파악, 프로젝트 계획 수립","데이터 이해: 초기 데이터 수집, 데이터 탐색, 품질 확인","데이터 준비: 데이터 정제, 통합, 포맷팅 (시간이 가장 오래 걸림)","모델링: 기법 선택, 테스트 계획, 모델 작성·평가 (과적합 발견 가능)","CRISP-DM 4레벨: 단계 → 일반화 태스크 → 세분화 태스크 → 프로세스 실행","단계 간 피드백(되돌아가기) 가능"]},

{s:2,q:"빅데이터 분석 방법론에서 '프로젝트 위험 계획 수립'이 속하는 단계는?",o:["분석 기획","데이터 준비","데이터 분석","평가 및 전개"],a:0,
e:"프로젝트 시작 전에 무엇을, 어디까지, 어떤 위험을 고려해 진행할지 계획하는 일은 첫 단계인 '분석 기획'에서 해요.\n\n분석 기획 단계의 3가지 태스크\n① 비즈니스 이해 및 범위 설정\n② 프로젝트 정의 및 계획 수립 (WBS 작성)\n③ 프로젝트 위험 계획 수립 (위험 식별 → 대응 계획)",
m:["5단계: 분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개","데이터 준비: 필요 데이터 정의, 데이터 스토어 설계, 데이터 수집 및 정합성 점검","데이터 분석: 분석용 데이터 준비, 텍스트 분석, 탐색적 분석, 모델링, 모델 평가 및 검증, 모델 적용 및 운영 방안","위험 대응 4가지: 회피 · 전이 · 완화 · 수용","SOW(작업 기술서), WBS(작업 분할 구조도)는 분석 기획 단계 산출물"]},

{s:2,q:"빅데이터 분석 방법론에서 '모델 발전 계획 수립'이 속하는 단계는?",o:["데이터 분석","시스템 구현","평가 및 전개","분석 기획"],a:2,
e:"모델을 운영한 뒤 앞으로 어떻게 개선·발전시킬지 계획하는 것은 마지막 '평가 및 전개' 단계예요.\n\n평가 및 전개 단계의 태스크\n① 모델 발전 계획 수립\n② 프로젝트 평가 및 보고 (정량적·정성적 성과 평가, 지식 자산화)\n\n헷갈리는 함정: '모델 평가 및 검증'은 '데이터 분석' 단계예요. 이름이 비슷하니 주의!",
m:["데이터 분석 단계: 모델링 → 모델 평가 및 검증 → 모델 적용 및 운영 방안","시스템 구현 단계: 설계 및 구현, 시스템 테스트 및 운영","평가 및 전개 단계: 모델 발전 계획, 프로젝트 평가 및 보고","3계층 구조: 단계(Phase) → 태스크(Task) → 스텝(Step)"]},

{s:2,q:"빅데이터 분석 방법론의 계층 구조로 옳은 것은?",o:["단계 → 태스크 → 스텝","단계 → 일반화 태스크 → 세분화 태스크","프로세스 → 태스크 → 스텝","단계 → 스텝 → 태스크"],a:0,
e:"빅데이터 분석 방법론은 3계층이에요.\n· 단계(Phase): 큰 단위, 단계마다 기준선(Baseline)을 설정해 버전 관리\n· 태스크(Task): 단계를 구성하는 작업 단위, 품질 검토 대상\n· 스텝(Step): 가장 작은 단위, 입력자료 → 처리 및 도구 → 출력자료로 구성 (WBS 워크 패키지)\n\n②는 CRISP-DM의 구조(4레벨)예요.",
m:["빅데이터 분석 방법론: 단계 → 태스크 → 스텝 (3계층)","CRISP-DM: 단계 → 일반화 태스크 → 세분화 태스크 → 프로세스 실행 (4레벨)","스텝의 구성: Input(입력자료) → Process & Tool(처리 및 도구) → Output(출력자료)"]},

{s:2,q:"상향식(Bottom-up) 접근 방식의 특징이 아닌 것은?",o:["디자인 사고(발산 → 수렴)","비지도 학습 활용","프로토타이핑","문제 탐색 → 문제 정의 → 해결방안 탐색 → 타당성 검토"],a:3,
e:"④는 문제가 주어졌을 때 해결책을 찾아가는 하향식(Top-down) 절차예요.\n\n상향식은 문제 정의 자체가 어려울 때, 데이터를 먼저 보면서 무엇이 문제인지 찾아가는 방식이에요.\n① 디자인 사고: 아이디어를 넓게 펼치고(발산) 좋은 것으로 좁힘(수렴)\n② 비지도 학습: 정답 없이 데이터 속 패턴 탐색 (군집, 연관분석)\n③ 프로토타이핑: 일단 빠르게 만들어 보고 결과를 보며 개선",
m:["하향식: '왜(Why)'에 집중, 답을 찾는 방식, 문제가 명확할 때","상향식: '무엇(What)' 관점, 사물을 있는 그대로 인식, 문제가 불명확할 때","하향식 문제 탐색: 비즈니스 모델 캔버스(업무 · 제품 · 고객 · 규제와 감사 · 지원 인프라)","분석 기회 확장: 거시적 관점(STEEP), 경쟁자 확대, 시장 니즈 변화, 역량의 재해석","타당성 검토: 경제적 타당성 + 데이터 및 기술적 타당성"]},

{s:2,q:"우선순위 사분면에서 '시급성'을 기준으로 할 때 과제 수행 순서는?",o:["III → IV → II","III → I → II","I → II → III","IV → III → II"],a:0,
e:"사분면의 배치\n· I: 시급성 현재 + 난이도 어려움\n· II: 시급성 미래 + 난이도 어려움\n· III: 시급성 현재 + 난이도 쉬움\n· IV: 시급성 미래 + 난이도 쉬움\n\n시급성을 중시하면 '지금 급한 것'을 먼저 해야 하지만, 급하고 쉬운 III을 끝낸 다음엔 어려운 I보다 쉬운 IV로 가요. 결국 III → IV → II.\n\n(난이도 기준이면 III → I → II)",
m:["항상 1순위 = III (현재 + 쉬움, Quick-Win)","항상 꼴찌 = II (미래 + 어려움)","시급성 기준: III → IV → II","난이도 기준: III → I → II","시급성은 '전략적 중요도·목표 가치(Value)', 난이도는 '투자 비용(Volume·Variety·Velocity)'과 연결"]},

{s:2,q:"우선순위 사분면에서 '난이도'를 기준으로 할 때 과제 수행 순서는?",o:["III → IV → II","III → I → II","II → I → III","I → III → IV"],a:1,
e:"난이도를 기준으로 한다는 건 '쉬운 것을 먼저 하자'가 아니라, 어렵더라도 현재 필요한 과제를 우선하는 관점이에요. 그래서 III(현재·쉬움) → I(현재·어려움) → II(미래·어려움) 순서입니다.\n\n외우는 요령: 두 기준 모두 III으로 시작해 II로 끝나고, 가운데만 다름 (시급성 IV / 난이도 I)",
m:["시급성 기준: III → IV → II","난이도 기준: III → I → II","난이도 판단 요소: 데이터 획득·저장·가공 비용, 분석 적용 비용, 분석 수준","시급성 판단 요소: 전략적 중요도, 목표 가치"]},

{s:2,q:"ROI 관점에서 빅데이터 4V 중 '비즈니스 효과'에 해당하는 것은?",o:["Volume","Variety","Velocity","Value"],a:3,
e:"ROI = 투자 대비 효과. 4V 중 Value(가치)가 '효과(Return)' 쪽이고, 나머지 3V는 데이터를 다루는 데 드는 '투자 비용(Investment)' 요소예요.\n\n· Volume: 데이터가 많을수록 저장·처리 비용 증가\n· Variety: 종류가 다양할수록 통합 비용 증가\n· Velocity: 빠를수록 실시간 처리 비용 증가",
m:["투자 비용 요소(난이도) = Volume, Variety, Velocity","비즈니스 효과 요소(시급성) = Value","우선순위 평가 기준(일반): 전략적 중요도, 비즈니스 성과/ROI, 실행 용이성","로드맵 수립 시 고려: 업무 내재화 적용 수준, 분석 데이터 적용 수준, 분석 기술 적용 수준"]},

{s:2,q:"데이터 분석 성숙도 모델의 단계 순서로 옳은 것은?",o:["도입 → 활용 → 확산 → 최적화","준비 → 도입 → 활용 → 확산","도입 → 확산 → 활용 → 최적화","활용 → 도입 → 최적화 → 확산"],a:0,
e:"CMMI 모델을 기반으로 한 4단계예요.\n· 도입: 분석을 시작, 환경과 시스템 구축\n· 활용: 분석 결과를 실제 업무에 적용\n· 확산: 전사 차원에서 분석을 관리하고 공유\n· 최적화: 분석을 진화시켜 혁신과 성과 향상에 기여\n\n'준비'는 성숙도 단계가 아니라 준비도·성숙도 사분면의 '준비형' 유형이에요.",
m:["성숙도 평가 3개 부문: 비즈니스 부문 · 조직·역량 부문 · IT 부문","분석 준비도 6영역: 분석 업무 파악 · 인력 및 조직 · 분석 기법 · 분석 데이터 · 분석 문화 · IT 인프라","확산 단계 특징: 전사 성과 실시간 분석, 분석 전문가 조직 운영, 빅데이터 관리 환경","최적화 단계 특징: 외부 환경 분석 활용, 최적화 업무 적용, 데이터 사이언스 그룹"]},

{s:2,q:"분석 준비도는 높지만 성숙도가 낮은 기업의 유형은?",o:["준비형","정착형","도입형","확산형"],a:2,
e:"인력·데이터·인프라 같은 '준비'는 잘 되어 있는데 아직 분석을 업무에 '활용(성숙)'하지 못하는 상태라서, 바로 분석을 '도입'할 수 있는 도입형이에요.\n\n다른 보기는?\n① 준비형: 준비도 낮음 + 성숙도 낮음 → 사전 준비가 필요\n② 정착형: 준비도 낮음 + 성숙도 높음 → 쓰고는 있지만 기반이 약해 정착 필요\n④ 확산형: 둘 다 높음 → 지속적으로 확산",
m:["준비형(↓↓) → 도입형(준비도↑) / 정착형(성숙도↑) → 확산형(↑↑)","헷갈릴 때: '준비도 높음 = 도입할 준비 완료 = 도입형'","'성숙도만 높음 = 이미 쓰고 있으니 정착시켜야 함 = 정착형'"]},

{s:2,q:"데이터 거버넌스의 구성 요소가 아닌 것은?",o:["원칙","조직","프로세스","시스템"],a:3,
e:"데이터 거버넌스는 원칙(Principle) · 조직(Organization) · 프로세스(Process) 3가지로 구성돼요.\n· 원칙: 데이터를 유지·관리하기 위한 지침과 가이드 (보안, 품질 기준)\n· 조직: 데이터를 관리할 조직의 역할과 책임 (데이터 관리자, DBA, 아키텍트)\n· 프로세스: 데이터 관리를 위한 활동과 체계 (작업 절차, 모니터링)\n\n'시스템'은 분석 거버넌스 구성요소에 들어가요.",
m:["데이터 거버넌스 체계: 데이터 표준화 · 데이터 관리 체계 · 데이터 저장소 관리 · 표준화 활동","데이터 표준화: 데이터 표준 용어, 명명 규칙, 메타데이터, 데이터 사전 구축","분석 거버넌스 구성요소 5가지: 조직 · 과제 기획/운영 프로세스 · 분석 관련 시스템 · 분석 교육·마인드 육성 체계 · 데이터","빅데이터 거버넌스: 산업 분야별·데이터 유형별로 차별화, 데이터 최적화와 정보 보존 주기 관리 중요"]},

{s:2,q:"별도의 분석 전담 조직이 전사 분석을 맡는 구조로, 현업 부서와 업무가 이원화될 수 있는 것은?",o:["집중형","기능형","분산형","혼합형"],a:0,
e:"집중형은 분석 전담 조직(예: 데이터분석팀)이 회사 전체의 분석 과제를 맡아 우선순위를 정해 진행해요. 전략적으로 중요한 과제부터 처리할 수 있지만, 현업 부서에도 분석 기능이 있으면 업무가 '이원화·중복'될 수 있어요.\n\n다른 보기는?\n② 기능형: 각 현업 부서가 직접 분석 → 전사적 관점의 분석 어려움, 부서 현황 분석에 그침\n③ 분산형: 분석 인력을 현업 부서에 배치 → 베스트 프랙티스 공유가 빠르지만 업무 과다·이원화 가능",
m:["집중형: 전담 조직 · 전사 우선순위 · 이원화 가능성","기능형: 현업 부서 직접 분석 · 국한된 분석 · 일반적인 형태","분산형: 분석 인력을 현업에 배치 · 신속한 실무 적용 · 부서 간 업무 과다","분석 과제 관리 프로세스: 과제 발굴(아이디어 발굴 → 과제 후보 제안 → 과제 확정) → 과제 수행(팀 구성 → 실행 → 진행 관리 → 결과 공유)"]},

{s:2,q:"분석 프로젝트의 위험 대응 방법이 아닌 것은?",o:["회피","전이","완화","무시"],a:3,
e:"위험 대응 4가지는 회피 · 전이 · 완화 · 수용이에요. 위험을 알면서 그대로 받아들이는 '수용'은 있지만, 위험을 '무시'하는 건 대응 방법이 아니에요.\n\n· 회피(Avoid): 위험이 생기지 않게 계획 자체를 바꿈\n· 전이(Transfer): 위험을 제3자에게 넘김 (보험, 외주)\n· 완화(Mitigate): 위험의 발생 확률이나 영향을 줄임\n· 수용(Accept): 위험을 인정하고 그대로 받아들임",
m:["위험 대응 = 회피 · 전이 · 완화 · 수용","위험 계획 수립은 빅데이터 분석 방법론의 '분석 기획' 단계","프로젝트 관리 영역 10가지(KS A ISO 21500): 통합 · 이해관계자 · 범위 · 자원 · 시간 · 원가 · 리스크 · 품질 · 조달 · 의사소통"]},

{s:2,q:"분석 프로젝트 속성 중 '모델을 반복 적용해도 결과가 일정한 정도(안정성)'를 뜻하는 것은?",o:["Accuracy","Precision","Speed","Data Size"],a:1,
e:"Precision(정밀도)은 같은 모델을 여러 번 써도 결과가 일관되게 나오는 '안정성'이에요.\nAccuracy(정확도)는 모델 결과와 실제 값의 차이가 작은 정도로, '활용' 측면에서 중요해요.\n\n과녁으로 생각하면: 화살이 한곳에 몰리면 Precision 높음, 화살이 과녁 중앙에 가까우면 Accuracy 높음.\n둘은 트레이드오프 관계일 수 있어요.",
m:["분석 프로젝트 5가지 속성: Data Size · Data Complexity · Speed · Analytic Complexity · Accuracy & Precision","Analytic Complexity: 모델이 복잡할수록 정확도는 오르지만 해석이 어려워짐 → 균형점 찾기","분석 프로젝트는 시행착오가 많아 '범위'가 자주 변하고, '시간'은 Time Boxing 기법으로 관리","분석 기획 고려사항 3가지: 가용 데이터 · 적절한 유스케이스 · 장애요소에 대한 사전 계획"]},

// ===================== 3과목 =====================
{s:3,q:"제1종 오류에 대한 설명으로 옳은 것은?",o:["귀무가설이 참인데 기각하는 오류","귀무가설이 거짓인데 채택하는 오류","대립가설이 참인데 기각하는 오류","표본 크기가 작아서 생기는 오류"],a:0,
e:"제1종 오류는 '사실은 차이가 없는데(H0 참) 차이가 있다고 결론(H0 기각)'하는 실수예요. 화재경보기로 치면 불이 안 났는데 경보가 울린 것. 이 오류를 범할 확률이 α(유의수준)입니다.\n\n다른 보기는?\n② H0가 거짓인데 채택: 제2종 오류(β), 불이 났는데 경보가 안 울림\n③ 대립가설이 참인데 기각 = H0가 거짓인데 채택 → 역시 제2종 오류",
m:["제1종 오류 확률 = α (유의수준), 보통 0.05","제2종 오류 확률 = β","검정력 = 1 − β (H0가 거짓일 때 제대로 기각할 확률)","α를 줄이면 β가 커지는 관계 (표본 크기를 키우면 둘 다 줄일 수 있음)","귀무가설(H0): '차이·효과가 없다' / 대립가설(H1): '차이가 있다' (증명하고 싶은 것)"]},

{s:3,q:"유의수준 0.05에서 p-value가 0.03으로 나왔다. 올바른 결론은?",o:["귀무가설을 채택한다","귀무가설을 기각한다","판단할 수 없다","표본을 더 뽑아야 한다"],a:1,
e:"p-value(0.03)가 유의수준(0.05)보다 작으므로 귀무가설을 기각하고 대립가설을 채택해요. 즉 '통계적으로 유의한 차이가 있다'는 결론입니다.\n\np-value의 뜻: 귀무가설이 맞다고 가정할 때, 지금 같은(또는 더 극단적인) 결과가 나올 확률. 이 확률이 아주 작다면 '귀무가설이 맞다고 보기 어렵다'는 거예요.",
m:["p-value < α → H0 기각 → 유의함","p-value ≥ α → H0 기각 못 함 (채택)","R 출력에서 Pr(>|t|) 열, p-value 값을 보면 돼요","*** (0.001), ** (0.01), * (0.05) 별표가 많을수록 더 유의함","검정통계량이 기각역에 들어가면 H0 기각 (p-value 방식과 같은 결론)"]},

{s:3,q:"모집단을 학년별로 나누고, 각 학년에서 일정 수를 골고루 뽑는 표본 추출 방법은?",o:["단순 무작위 추출","계통 추출","집락 추출","층화 추출"],a:3,
e:"모집단을 성질이 비슷한 '층(학년)'으로 나눈 뒤, 각 층에서 골고루 뽑는 방법이 층화 추출이에요. 모든 층이 표본에 대표되도록 하는 게 목적입니다.\n\n다른 보기는?\n① 단순 무작위: 제비뽑기처럼 전체에서 무작위\n② 계통 추출: 번호를 매겨 일정 간격(5번, 10번, 15번…)으로 추출\n③ 집락 추출: 여러 그룹 중 몇 개를 골라 그 그룹을 '통째로' 조사 (반 3개를 뽑아 그 반 전원 조사)",
m:["층화: 층 내부는 동질적(비슷), 층 간은 이질적(다름) → 층마다 골고루","집락(군집): 집락 내부는 이질적(다양), 집락 간은 동질적 → 집락을 통째로","비례 층화 추출: 층의 크기에 비례해 표본 수 배정","표본 추출 오차 vs 비표본 오차(측정·응답 오류 등)"]},

{s:3,q:"섭씨온도(℃)는 어떤 척도에 해당할까?",o:["명목척도","순서척도","구간척도","비율척도"],a:2,
e:"온도는 10℃와 20℃의 차이, 20℃와 30℃의 차이가 같아서 '간격'은 의미가 있어요. 하지만 0℃는 '온도가 없다'는 뜻이 아니므로 '절대 0'이 없어요. 그래서 20℃가 10℃보다 '두 배 덥다'고 할 수 없어요 → 구간척도.\n\n다른 보기는?\n① 명목: 이름표일 뿐 (성별, 혈액형)\n② 순서: 순서만 의미 (학점, 만족도)\n④ 비율: 간격 + 절대 0 있음 (키, 몸무게, 나이, 소득)",
m:["척도 수준: 명목 < 순서 < 구간 < 비율","명목·순서 = 범주형(질적) 변수 / 구간·비율 = 연속형(양적) 변수","구간척도 예: 온도(℃), IQ, 연도","비율척도는 곱셈·나눗셈 가능 (몸무게 60kg는 30kg의 두 배)","척도에 따라 쓸 수 있는 통계가 달라요 (명목 → 최빈값, 순서 → 중앙값, 구간·비율 → 평균)"]},

{s:3,q:"혼동행렬의 정밀도(Precision)는?",calc:"            실제 양성   실제 음성\n예측 양성     TP=40      FP=10\n예측 음성     FN=20      TN=30",o:["0.70","0.67","0.75","0.80"],a:3,
e:"정밀도 = TP / (TP + FP) = 40 / (40 + 10) = 40 / 50 = 0.80\n\n'모델이 양성이라고 예측한 것(표의 윗줄)' 중에서 실제로 양성인 비율이에요. 스팸 필터로 치면 '스팸이라고 걸러낸 메일 중 진짜 스팸의 비율'.\n\n다른 보기는?\n0.70 = 정확도, 0.67 = 재현율, 0.75 = 특이도",
m:["정밀도는 '예측' 기준 (가로줄), 재현율·특이도는 '실제' 기준 (세로줄)","정밀도가 중요한 상황: 잘못 양성 판정하면 손해가 클 때 (정상 메일을 스팸 처리)","재현율이 중요한 상황: 놓치면 큰일 날 때 (암 진단, 사기 탐지)","정밀도와 재현율은 보통 트레이드오프 → 둘을 같이 보는 F1 점수 사용","⚠ 시험에서 행·열(실제/예측)을 뒤집어 주기도 하니 꼭 확인!"]},

{s:3,q:"같은 혼동행렬에서 재현율(민감도)은?",calc:"            실제 양성   실제 음성\n예측 양성     TP=40      FP=10\n예측 음성     FN=20      TN=30",o:["0.67","0.80","0.75","0.70"],a:0,
e:"재현율 = TP / (TP + FN) = 40 / (40 + 20) = 40 / 60 ≈ 0.67\n\n'실제 양성인 것(표의 왼쪽 세로줄)' 중에서 모델이 양성이라고 잡아낸 비율이에요. 환자 60명 중 40명을 찾아낸 것.\n\n재현율 = 민감도(Sensitivity) = TPR(True Positive Rate), 모두 같은 말이에요.",
m:["재현율 = 민감도 = TPR = Recall","FN(놓친 것)이 줄어야 재현율이 올라감","ROC 곡선의 Y축 = 민감도(TPR)","F1 = 2 × 정밀도 × 재현율 / (정밀도 + 재현율) → 이 문제라면 2×0.8×0.67/(1.47) ≈ 0.73"]},

{s:3,q:"같은 혼동행렬에서 특이도(Specificity)는?",calc:"            실제 양성   실제 음성\n예측 양성     TP=40      FP=10\n예측 음성     FN=20      TN=30",o:["0.60","0.70","0.75","0.80"],a:2,
e:"특이도 = TN / (TN + FP) = 30 / (30 + 10) = 30 / 40 = 0.75\n\n'실제 음성인 것(표의 오른쪽 세로줄)' 중에서 모델이 음성이라고 맞힌 비율이에요. 건강한 사람 40명 중 30명을 '건강하다'고 맞힌 것.",
m:["특이도 = TNR (True Negative Rate)","FPR(거짓 긍정률) = FP / (TN + FP) = 1 − 특이도 = 0.25","ROC 곡선의 X축 = 1 − 특이도 (FPR)","민감도와 특이도는 둘 다 '실제' 기준으로 나눠요 (분모가 세로줄 합)"]},

{s:3,q:"같은 혼동행렬에서 정확도(Accuracy)는?",calc:"            실제 양성   실제 음성\n예측 양성     TP=40      FP=10\n예측 음성     FN=20      TN=30",o:["0.60","0.70","0.80","0.40"],a:1,
e:"정확도 = (TP + TN) / 전체 = (40 + 30) / 100 = 0.70\n\n대각선(맞힌 것)을 더해 전체로 나누면 돼요.\n\n오분류율(Error rate) = (FP + FN) / 전체 = 30 / 100 = 0.30 = 1 − 정확도",
m:["정확도의 함정: 불균형 데이터에서는 믿기 어려움 (사기 1%인 데이터에서 전부 '정상'이라 해도 정확도 99%)","그래서 불균형 데이터는 재현율, 정밀도, F1, AUC를 같이 봐요","불균형 해결: 언더샘플링(많은 쪽 줄이기), 오버샘플링(적은 쪽 늘리기, SMOTE)"]},

{s:3,q:"규칙 '빵 → 우유'의 향상도(Lift)는?",calc:"전체 거래 100건\n빵 포함 20건, 우유 포함 40건\n빵과 우유 동시 포함 10건",o:["0.10","0.25","0.50","1.25"],a:3,
e:"① 확률로 바꾸기: P(빵) = 0.2, P(우유) = 0.4, P(빵∩우유) = 0.1\n② 신뢰도 = P(빵∩우유) / P(빵) = 0.1 / 0.2 = 0.5\n③ 향상도 = 신뢰도 / P(우유) = 0.5 / 0.4 = 1.25\n\n(한 번에: 0.1 / (0.2 × 0.4) = 0.1 / 0.08 = 1.25)\n\n해석: 아무 조건 없이 우유를 살 확률은 40%인데, 빵을 산 사람은 50%가 우유를 사요. 빵이 우유 구매 확률을 1.25배 높여준다는 뜻.\n\n다른 보기: 0.10 = 지지도, 0.50 = 신뢰도",
m:["지지도 = P(A∩B)","신뢰도 = P(A∩B) / P(A)","향상도 = P(A∩B) / (P(A) × P(B))","향상도 > 1 양의 관계, = 1 독립, < 1 음의 관계","좋은 규칙 = 지지도·신뢰도·향상도 모두 높은 규칙"]},

{s:3,q:"같은 데이터에서 '빵 → 우유'의 신뢰도는?",calc:"전체 거래 100건\n빵 포함 20건, 우유 포함 40건\n빵과 우유 동시 포함 10건",o:["0.10","0.25","0.50","0.40"],a:2,
e:"신뢰도 = 빵과 우유를 같이 산 거래 / 빵을 산 거래 = 10 / 20 = 0.5\n\n'빵을 산 사람 중에서 우유도 산 사람의 비율'이에요. 화살표 앞쪽(조건)인 빵이 분모가 됩니다.\n\n다른 보기는?\n0.10 = 지지도 (10/100)\n0.25 = 우유 → 빵의 신뢰도 (10/40)\n0.40 = P(우유)",
m:["신뢰도 = P(B|A) = 조건부 확률","분모는 화살표 앞쪽(A)의 거래 수","'우유 → 빵'의 신뢰도는 10/40 = 0.25 로 달라져요","지지도 = 10/100 = 0.1 (방향 상관없이 같음)"]},

{s:3,q:"연관규칙에서 향상도가 1이라는 것의 의미는?",o:["두 품목이 항상 같이 팔린다","두 품목은 서로 독립이다","두 품목은 대체재다","규칙의 신뢰도가 100%다"],a:1,
e:"향상도 = P(A∩B) / (P(A)×P(B)) 가 1이라는 건 P(A∩B) = P(A)×P(B), 즉 확률론에서 '독립'의 정의 그 자체예요. A를 샀다고 B를 살 확률이 달라지지 않는다는 뜻.\n\n다른 보기는?\n① '항상 같이' 팔리는 건 신뢰도가 100%(1)인 경우에 가까워요\n③ 대체재(같이 안 삼)는 향상도 < 1\n④ 신뢰도 100%는 향상도와 별개",
m:["향상도 > 1: 보완재 (같이 사는 경향) 예) 라면과 계란","향상도 = 1: 독립 (서로 무관)","향상도 < 1: 대체재 (하나 사면 다른 걸 덜 삼) 예) 콜라와 사이다","향상도는 A → B, B → A 어느 방향이든 같은 값"]},

{s:3,q:"규칙 A → B와 B → A를 비교할 때 값이 달라질 수 있는 지표는?",o:["지지도","신뢰도","향상도","모두 같다"],a:1,
e:"· 지지도 P(A∩B): 순서와 상관없이 같음\n· 향상도 P(A∩B) / (P(A)P(B)): 분모가 곱셈이라 순서와 상관없이 같음\n· 신뢰도: A → B는 P(A∩B)/P(A), B → A는 P(A∩B)/P(B) → 분모가 달라서 다른 값\n\n앞 문제 예시: 빵 → 우유 신뢰도 0.5, 우유 → 빵 신뢰도 0.25",
m:["대칭 지표: 지지도, 향상도","비대칭 지표: 신뢰도","연관분석 장점: 결과가 if-then으로 이해 쉬움, 목표 변수 없는 탐색(비목적성), 계산 간단","연관분석 단점: 품목이 많으면 계산량 폭증, 거래가 드문 품목은 규칙 발견 어려움","순차 패턴: 시간 순서까지 고려 (노트북 구매 → 일주일 뒤 마우스)"]},

{s:3,q:"Apriori 알고리즘이 계산량을 줄이기 위해 사용하는 기준은?",o:["최소 신뢰도","최소 지지도","최대 향상도","최소 거리"],a:1,
e:"Apriori는 '최소 지지도' 이상인 항목집합(빈발 항목집합)만 남기고 나머지는 버려요.\n핵심 원리: '어떤 집합이 빈발하지 않으면, 그걸 포함하는 더 큰 집합도 빈발할 수 없다' → 그래서 작은 집합에서 걸러지면 큰 조합은 계산할 필요가 없어요.\n\n최소 신뢰도는 빈발 항목집합을 찾은 '후에' 규칙을 고를 때 쓰는 기준이에요.",
m:["Apriori 원리: 빈발 항목집합의 모든 부분집합도 빈발하다","FP-Growth: 트리(FP-Tree) 구조로 DB를 2번만 스캔 → Apriori보다 빠름","Apriori 단점: 후보 집합을 계속 만들고 DB를 여러 번 스캔해서 느림","최소 지지도를 너무 높이면 의미 있는 규칙도 놓칠 수 있음"]},

{s:3,q:"다중공선성을 의심하는 일반적인 VIF 기준은?",o:["1 초과","3 초과","5 미만","10 초과"],a:3,
e:"VIF(분산팽창요인)가 10을 넘으면 그 독립변수가 다른 독립변수들과 너무 강하게 상관되어 있다고 보고 다중공선성을 의심해요.\n\n다중공선성이란? 키와 다리 길이처럼 비슷한 정보를 가진 변수를 같이 넣으면, 회귀계수가 불안정해지고 부호가 이상하게 나오거나 유의성 판단이 어려워지는 문제예요.",
m:["VIF = 1 / (1 − R²ⱼ) (R²ⱼ: 해당 변수를 나머지 독립변수로 회귀했을 때의 결정계수)","VIF > 10 → 다중공선성 (기준을 5로 보는 경우도 있음)","해결 방법: 상관 높은 변수 제거, 주성분분석(PCA)으로 변수 압축, 릿지 회귀","다중공선성이 있어도 전체 모형의 예측력(R²)은 높게 나올 수 있어요"]},

{s:3,q:"계수를 0으로 만들 수 있어 변수 선택 효과가 있는 회귀는?",o:["릿지(Ridge)","라쏘(Lasso)","단순 선형회귀","로지스틱 회귀"],a:1,
e:"라쏘는 회귀계수의 '절댓값 합'에 벌점(L1)을 줘요. 이 방식은 덜 중요한 변수의 계수를 정확히 0으로 만들어 버리기 때문에, 자연스럽게 변수 선택이 이뤄져요.\n\n다른 보기는?\n① 릿지: 계수의 '제곱합'에 벌점(L2). 계수를 0에 가깝게 줄이지만 0이 되지는 않음 → 다중공선성 완화에 좋음\n③④ 벌점이 없는 일반 회귀",
m:["Ridge = L2 = 제곱합 벌점 = 0 안 됨","Lasso = L1 = 절댓값 벌점 = 0 가능 = 변수 선택","Elastic Net = L1 + L2 혼합","벌점(λ)이 클수록 계수가 더 많이 줄어듦 → 과적합 방지 (정규화)"]},

{s:3,q:"선형 회귀분석의 가정이 아닌 것은?",o:["선형성","독립성","등분산성","이분산성"],a:3,
e:"회귀분석은 잔차(오차)의 분산이 X 값에 상관없이 '일정'하다고 가정해요(등분산성). 잔차의 분산이 X에 따라 달라지는 '이분산성'은 가정을 위반한 상태예요.\n\n회귀분석 4가지 가정\n· 선형성: X와 Y가 직선 관계\n· 독립성: 잔차끼리 서로 상관이 없음\n· 등분산성: 잔차의 퍼짐이 일정\n· 정규성: 잔차가 정규분포를 따름",
m:["선형성 확인: 산점도","독립성 확인: Durbin-Watson 검정 (2에 가까우면 OK)","등분산성 확인: 잔차 vs 적합값 그래프 (깔때기 모양이면 위반)","정규성 확인: Q-Q plot (직선 위에 점), Shapiro-Wilk 검정","잔차 = 실제값 − 예측값, 최소제곱법은 잔차제곱합을 최소화"]},

{s:3,q:"Durbin-Watson 검정은 회귀분석의 어떤 가정을 확인할 때 쓸까?",o:["정규성","독립성","등분산성","선형성"],a:1,
e:"Durbin-Watson은 잔차들 사이에 자기상관(앞의 오차가 뒤의 오차에 영향을 주는 것)이 있는지, 즉 '독립성'을 확인하는 검정이에요. 시계열 데이터에서 특히 중요해요.\n\n해석: 0~4 사이 값이고, 2에 가까우면 자기상관 없음(독립), 0에 가까우면 양의 자기상관, 4에 가까우면 음의 자기상관.",
m:["Durbin-Watson → 독립성","Shapiro-Wilk, Kolmogorov-Smirnov, Q-Q plot → 정규성","잔차도(잔차 vs 적합값) → 등분산성","산점도 → 선형성"]},

{s:3,q:"SST = 100, SSE = 20일 때 결정계수 R²는?",o:["0.2","0.5","0.8","1.2"],a:2,
e:"R² = 1 − SSE / SST = 1 − 20 / 100 = 0.8\n\n· SST(총 변동): Y가 평균에서 얼마나 흩어져 있는지 전체\n· SSR(회귀 변동): 모형이 설명한 부분\n· SSE(오차 변동): 모형이 설명 못 한 부분\nSST = SSR + SSE 이므로 SSR = 80, R² = SSR/SST = 80/100 = 0.8 로 계산해도 같아요.\n\n해석: 모형이 Y 변동의 80%를 설명한다.",
m:["R² = SSR / SST = 1 − SSE / SST, 범위 0 ~ 1","단순회귀에서 R² = (상관계수 r)²","수정 결정계수: 변수를 추가하면 R²는 무조건 오르므로, 변수 개수로 보정 → 다중회귀 비교 시 사용","R²가 1을 넘는 일은 없어요 (보기 1.2는 함정)"]},

{s:3,q:"회귀분석 결과에서 '모형 전체가 유의한가'를 판단할 때 보는 것은?",o:["각 계수의 t값","F 통계량의 p-value","결정계수","잔차의 평균"],a:1,
e:"R summary 맨 아래 줄 'F-statistic: …, p-value: …' 이 모형 전체 유의성이에요. p-value < 0.05 이면 '적어도 하나의 회귀계수는 0이 아니다' → 모형이 유의함.\n\n다른 보기는?\n① 각 계수의 t값과 Pr(>|t|): 개별 변수의 유의성\n③ 결정계수: 설명력(얼마나 잘 맞나), 유의성과는 다른 개념\n④ 잔차의 평균은 항상 0",
m:["F검정 → 모형 전체 유의성","t검정 → 각 회귀계수 유의성","R² → 설명력","R 출력 Estimate 열 = 회귀계수 → 회귀식 작성","예) Estimate가 3.5 → X가 1 증가하면 Y가 3.5 증가"]},

{s:3,q:"ARIMA(1, 2, 0) 모형에서 '2'의 의미는?",o:["AR 차수가 2","MA 차수가 2","2번 차분했다","계절 주기가 2"],a:2,
e:"ARIMA(p, d, q)\n· p: AR(자기회귀) 차수 → 1\n· d: 차분 횟수 → 2\n· q: MA(이동평균) 차수 → 0\n\n즉 '2번 차분해서 정상 시계열로 만든 뒤 AR(1) 모형을 적용'한 것이에요.\n차분 = 오늘 값 − 어제 값. 추세(평균이 변함)를 없애 정상성을 만들어요.",
m:["ARIMA(p, 0, q) = ARMA(p, q)","ARIMA(0, d, 0) = 랜덤워크 형태","AR(p): PACF가 p 시차 이후 절단, ACF는 천천히 감소","MA(q): ACF가 q 시차 이후 절단, PACF는 천천히 감소","분해 시계열 4요인: 추세 · 계절 · 순환 · 불규칙"]},

{s:3,q:"시계열의 정상성 조건으로 옳지 않은 것은?",o:["평균이 일정하다","분산이 시점에 의존하지 않는다","공분산은 시차에만 의존한다","뚜렷한 추세가 있다"],a:3,
e:"추세가 있으면 시간이 지나며 평균이 계속 변하니 정상성이 깨진 거예요. 정상 시계열은 '시간이 지나도 통계적 성질이 변하지 않는' 시계열입니다.\n\n정상성 3조건\n① 평균이 일정\n② 분산이 시점과 무관하게 일정\n③ 공분산은 시점이 아닌 '시차(간격)'에만 의존",
m:["평균이 일정하지 않으면 → 차분","분산이 일정하지 않으면 → 변환 (로그 변환 등)","계절성이 있으면 → 계절 차분","정상 시계열은 평균 주위에서 일정한 폭으로 움직이고, 평균으로 돌아가려는 성질이 있어요","지수평활법: 최근 데이터에 더 큰 가중치"]},

{s:3,q:"주성분분석(PCA)에서 주성분 개수를 정하는 기준이 아닌 것은?",o:["누적 기여율 70~90%","스크리 플롯의 꺾이는 지점","고유값 1 이상","VIF 10 이상"],a:3,
e:"VIF는 회귀분석의 다중공선성 진단 기준이라 PCA와 관계없어요.\n\n주성분 개수 결정 기준\n① 누적 기여율(누적 분산 설명 비율)이 70~90% 이상 되는 지점까지\n② 스크리 플롯에서 그래프가 급격히 꺾여 완만해지는 지점(elbow) 직전까지\n③ 고유값(분산)이 1 이상인 주성분까지 (상관행렬 사용 시)",
m:["PCA = 서로 상관 있는 여러 변수를 상관없는 몇 개의 주성분으로 압축 (차원 축소)","제1주성분이 분산을 가장 많이 설명, 주성분끼리는 서로 독립(직교)","변수의 단위가 다르면 상관행렬(표준화) 사용","R 출력의 Cumulative Proportion = 누적 기여율","PCA는 다중공선성 해결 방법으로도 쓰여요"]},

{s:3,q:"다차원척도법(MDS)에서 가장 적합도가 좋은 스트레스 값은?",o:["0.02","0.15","0.25","0.40"],a:0,
e:"스트레스(Stress)는 원래 거리와 지도 위 거리의 차이(불일치 정도)라서, 0에 가까울수록 원래 관계를 잘 표현한 거예요.\n\n기준(Kruskal)\n· 0: 완벽\n· 0.025 이하: 아주 좋음\n· 0.05: 좋음\n· 0.1: 보통\n· 0.2 이상: 나쁨",
m:["MDS = 개체 간 거리(유사성)를 2~3차원 공간에 점으로 표현","계량적 MDS: 구간·비율 척도, R cmdscale()","비계량적 MDS: 순서 척도, R isoMDS()","PCA는 '변수'를 줄이고, MDS는 '개체 간 관계'를 시각화"]},

{s:3,q:"빨간 공 6개, 파란 공 4개가 섞인 마디의 지니 지수는?",o:["0.24","0.48","0.52","1.00"],a:1,
e:"지니 지수 = 1 − Σ(각 클래스 비율)²\n빨강 비율 0.6, 파랑 비율 0.4\n= 1 − (0.6² + 0.4²) = 1 − (0.36 + 0.16) = 1 − 0.52 = 0.48\n\n보기 0.52는 '1 −'를 빼먹은 값(함정), 0.24는 0.6×0.4.\n\n해석: 지니 지수는 '불순도'라서, 0이면 한 종류만 있는 순수한 마디, 값이 클수록 많이 섞인 마디예요. 두 클래스일 때 최댓값은 0.5 (반반).",
m:["의사결정나무는 분리 후 지니 지수(불순도)가 가장 크게 '감소'하는 기준으로 나눠요","엔트로피 = −Σ p·log₂p, 역시 작을수록 순수 (두 클래스 반반일 때 최댓값 1)","카이제곱 통계량은 p-value가 작을수록 좋은 분리","회귀나무 분리 기준: F통계량의 p-value, 분산 감소량"]},

{s:3,q:"CHAID 의사결정나무 알고리즘의 분류 분리 기준은?",o:["지니 지수","엔트로피","카이제곱 통계량","분산 감소량"],a:2,
e:"CHAID(CHi-squared Automatic Interaction Detection)는 이름처럼 카이제곱(Chi-squared) 통계량을 분리 기준으로 써요. 다지 분리(한 번에 여러 가지로 나눔)가 가능합니다.\n\n다른 보기는?\n① 지니 지수: CART\n② 엔트로피(정보 이득): C4.5 / C5.0\n④ 분산 감소량: CART의 회귀나무",
m:["CART: 분류 = 지니, 회귀 = 분산 감소, 항상 이진 분리","C4.5 / C5.0: 엔트로피 (정보 이득비)","CHAID: 분류 = 카이제곱, 회귀 = F검정, 다지 분리","의사결정나무 장점: 해석 쉬움, 비모수(가정 불필요), 이상치에 강함","단점: 분리 경계 근처 오류, 데이터가 조금 바뀌어도 나무가 크게 바뀜(불안정)","정지 규칙 = 더 이상 안 나눔 / 가지치기 = 과적합 방지 위해 가지 제거"]},

{s:3,q:"랜덤 포레스트에 대한 설명으로 옳은 것은?",o:["틀린 데이터에 가중치를 주며 순차 학습한다","배깅에 더해 나무를 나눌 때 변수도 무작위로 일부만 고른다","하나의 깊은 나무만 만든다","덴드로그램으로 결과를 표현한다"],a:1,
e:"랜덤 포레스트 = 배깅(부트스트랩 샘플로 여러 나무를 만들어 투표) + 각 노드를 나눌 때 전체 변수 중 '무작위로 일부만' 후보로 사용.\n변수까지 무작위로 고르면 나무들이 서로 덜 비슷해져서, 투표했을 때 예측이 더 안정적이에요.\n\n다른 보기는?\n① 부스팅의 설명\n③ 단일 의사결정나무\n④ 계층적 군집의 결과 표현",
m:["장점: 예측력 높음, 과적합에 강함, 변수 중요도 확인 가능","단점: 나무가 수백 개라 해석이 어려움(블랙박스)","분류는 다수결 투표, 회귀는 평균","배깅의 목적: 분산(variance) 감소"]},

{s:3,q:"이전 모델이 틀린 데이터에 가중치를 주며 순차적으로 학습하는 앙상블 기법은?",o:["배깅","부스팅","랜덤 포레스트","K-fold"],a:1,
e:"부스팅은 첫 모델이 틀린 데이터에 가중치를 높여서 다음 모델이 그 데이터를 더 집중해 학습하게 해요. 오답노트처럼 '순차적으로' 약점을 보완하는 방식입니다.\n\n다른 보기는?\n① 배깅: 여러 모델을 '독립적으로(병렬)' 만들고 투표\n③ 랜덤 포레스트: 배깅 + 변수 무작위 선택\n④ K-fold: 앙상블이 아니라 교차검증 방법",
m:["대표 부스팅: AdaBoost, GBM(Gradient Boosting), XGBoost, LightGBM","배깅 = 병렬 / 부스팅 = 순차","부스팅은 편향(bias) 감소에 효과적, 단 이상치에 민감할 수 있음","앙상블 = 여러 모델 결합 → 단일 모델보다 성능·안정성 향상"]},

{s:3,q:"ROC 곡선의 X축은?",o:["민감도","정밀도","1 − 특이도","재현율"],a:2,
e:"ROC 곡선\n· X축: FPR = 1 − 특이도 (음성인데 양성이라고 잘못 판정한 비율)\n· Y축: TPR = 민감도 (양성을 양성이라고 맞힌 비율)\n\n분류 기준값(cut-off)을 바꿔가며 두 값을 찍어 그린 곡선이에요. 곡선이 왼쪽 위 모서리(0, 1)에 가까울수록 좋은 모델.\n\n① 민감도와 ④ 재현율은 같은 말이고 Y축이에요.",
m:["AUC = ROC 곡선 아래 면적, 1에 가까울수록 좋음","AUC 0.5 = 대각선 = 무작위 추측(동전 던지기)","이익도표(Gain chart): 예측 확률 상위 구간부터 실제 반응을 얼마나 잡는지","향상도 곡선(Lift curve): 상위 구간의 반응률 / 전체 반응률, 좋은 모델은 상위에서 높고 빠르게 감소"]},

{s:3,q:"로지스틱 회귀에서 회귀계수 β = 0.7일 때, X가 1 증가하면 오즈는?",o:["0.7 증가","0.7배","exp(0.7)배","log(0.7)배"],a:2,
e:"로지스틱 회귀식은 log(오즈) = β0 + β1·X 형태예요. X가 1 늘면 log(오즈)가 β1만큼 늘고, 양변에 exp를 씌우면 오즈는 exp(β1)배가 돼요.\nexp(0.7) ≈ 2.01 → X가 1 증가하면 성공 오즈가 약 2배.\n\n오즈 = 성공 확률 / 실패 확률 = p / (1 − p)\n예) 합격 확률 0.8 → 오즈 = 0.8 / 0.2 = 4",
m:["로지스틱 회귀 = 종속변수가 범주형(0/1)일 때","출력은 0~1 사이 확률 (시그모이드 함수)","로짓 = log(p / (1 − p))","오즈비 = exp(β), β > 0이면 오즈 증가, β < 0이면 감소","R: glm(y ~ x, family = binomial)","모형 적합 방법: 최대우도추정법(MLE)"]},

{s:3,q:"군집을 합쳤을 때 군집 내 오차제곱합의 증가가 가장 작은 쪽으로 병합하는 연결법은?",o:["최단 연결법","최장 연결법","평균 연결법","와드 연결법"],a:3,
e:"와드(Ward) 연결법은 거리 대신, 두 군집을 합쳤을 때 '군집 내 오차제곱합(SSE)'이 얼마나 늘어나는지를 보고 가장 적게 늘어나는 쌍을 합쳐요. 비슷한 크기의 군집을 만드는 경향이 있어요.\n\n다른 보기는?\n① 최단(단일): 두 군집에서 가장 가까운 점 사이 거리 → 길게 늘어진 군집이 생기기 쉬움\n② 최장(완전): 가장 먼 점 사이 거리 → 둥글고 조밀한 군집\n③ 평균: 모든 점 쌍 거리의 평균",
m:["중심 연결법: 두 군집의 중심 사이 거리","계층적 군집 결과 = 덴드로그램, 원하는 높이에서 잘라 군집 수 결정","계층적 군집은 한번 합쳐지면 다시 나눌 수 없음","병합형(아래에서 위로) vs 분할형(위에서 아래로)","R: hclust(dist(x), method = \"ward.D2\")"]},

{s:3,q:"K-means 군집의 특징으로 옳지 않은 것은?",o:["군집 수 K를 미리 정해야 한다","이상치에 민감하다","초기 중심값에 따라 결과가 달라질 수 있다","한번 배정된 데이터는 다른 군집으로 이동할 수 없다"],a:3,
e:"K-means는 중심을 다시 계산할 때마다 데이터가 더 가까운 군집으로 옮겨갈 수 있어요. '한번 합치면 끝'은 계층적 군집의 특징입니다.\n\nK-means 절차\n① K개의 초기 중심 선택\n② 각 데이터를 가장 가까운 중심에 배정\n③ 군집별 평균으로 중심 재계산\n④ 변화가 없을 때까지 ②~③ 반복",
m:["K 결정: 엘보우(Elbow) 기법, 실루엣 계수","이상치 민감 → 보완: K-medoids (평균 대신 실제 데이터 점을 중심으로)","볼록하지 않은(구부러진) 모양의 군집은 잘 못 찾음 → DBSCAN","장점: 단순하고 빠름, 대용량에 적합","R: kmeans(x, centers = 3)"]},

{s:3,q:"자기조직화지도(SOM)에 대한 설명으로 옳은 것은?",o:["지도학습 신경망이다","역전파 알고리즘을 사용한다","입력층과 경쟁층으로 구성된다","K를 미리 정해야 한다"],a:2,
e:"SOM(Self-Organizing Map)은 코호넨이 만든 '비지도' 신경망으로, 입력층과 경쟁층(2차원 격자) 두 층으로 구성돼요. 입력과 가장 가까운 경쟁층 노드(승자 노드)가 그 데이터를 차지하고, 승자와 이웃 노드의 가중치를 조정해요.\n\n다른 보기는?\n① 정답 없이 학습하는 비지도 학습\n② 역전파를 쓰지 않고 한 번의 전방 패스(feed-forward)만 사용 → 빠름\n④ K를 미리 정하는 건 K-means",
m:["SOM = 비지도 · 입력층 + 경쟁층 · 역전파 X · 승자 독식","고차원 데이터를 2차원 지도로 시각화 (차원 축소 + 군집)","입력 데이터의 위상(이웃 관계)을 보존","인공신경망(지도학습)은 역전파로 가중치를 조정한다는 점과 비교"]},

{s:3,q:"밀도가 높은 영역을 군집으로 묶고, 이상한 모양의 군집도 찾을 수 있는 방법은?",o:["K-means","DBSCAN","와드 연결법","혼합분포 군집"],a:1,
e:"DBSCAN은 일정 반경 안에 점이 충분히 많은(밀도가 높은) 영역을 이어서 군집을 만들어요. 그래서 K를 미리 정할 필요가 없고, 초승달처럼 이상한 모양의 군집도 찾을 수 있으며, 어디에도 속하지 않는 점은 노이즈(이상치)로 처리해요.\n\n다른 보기는?\n① K-means: 둥근 모양 군집에 강함, K 필요\n③ 와드: 계층적 군집\n④ 혼합분포: 확률분포 기반 (EM 알고리즘)",
m:["DBSCAN 파라미터: 반경(eps), 최소 점 개수(MinPts)","혼합분포 군집: 데이터가 여러 정규분포의 혼합이라 가정, EM 알고리즘(E: 각 데이터가 어느 분포에 속할 확률 계산 / M: 모수 갱신)","혼합분포 군집은 이상치에 민감, 데이터가 커야 함","군집 평가: 실루엣 계수 (−1 ~ 1, 1에 가까울수록 잘 나뉨)"]},

{s:3,q:"점 A(1, 2)와 B(4, 6) 사이의 유클리드 거리는?",o:["5","7","4","25"],a:0,
e:"유클리드 거리 = √((x₁ − x₂)² + (y₁ − y₂)²)\n= √((4 − 1)² + (6 − 2)²) = √(9 + 16) = √25 = 5\n\n두 점을 잇는 직선 거리(피타고라스 정리)예요.\n\n다른 보기는?\n7 = 맨해튼 거리 (|4−1| + |6−2| = 3 + 4)\n4 = 체비셰프 거리 (차이 중 최댓값 max(3, 4))\n25 = 루트를 안 씌운 값 (함정)",
m:["맨해튼 = 바둑판 길로 가는 거리, 차이의 절댓값 합","체비셰프 = 좌표 차이 중 가장 큰 값","민코프스키 = 일반화 (m=1 맨해튼, m=2 유클리드)","표준화 거리 = 표준편차로 나눠 단위 차이 제거","범주형: 자카드 거리, 텍스트: 코사인 유사도"]},

{s:3,q:"변수 간 상관관계(공분산)까지 고려하는 거리 척도는?",o:["유클리드","맨해튼","마할라노비스","체비셰프"],a:2,
e:"마할라노비스 거리는 각 변수의 표준편차로 나누는 표준화에 더해, 변수끼리의 상관관계(공분산 행렬)까지 반영해요. 키와 몸무게처럼 서로 관련된 변수가 있을 때 정보가 이중으로 계산되는 걸 막아줍니다.\n\n다른 보기는? 모두 변수 간 상관을 고려하지 않아요.\n① 유클리드: 직선 거리\n② 맨해튼: 절댓값 합\n④ 체비셰프: 최대 차이",
m:["표준화 거리: 단위 차이만 제거 (상관 고려 X)","마할라노비스: 단위 차이 + 상관 고려","연속형 거리: 유클리드, 맨해튼, 체비셰프, 민코프스키, 표준화, 마할라노비스","범주형 거리: 자카드, 단순 일치 계수","군집분석 전에는 변수 단위를 맞추는 표준화가 중요해요"]},

{s:3,q:"R에서 c(1, \"a\", TRUE)의 결과 타입은?",o:["숫자형","문자형","논리형","리스트"],a:1,
e:"R의 벡터는 '한 가지 타입'만 담을 수 있어요. 여러 타입을 섞으면 모두를 표현할 수 있는 타입으로 자동 변환되는데, 우선순위는 문자 > 숫자 > 논리예요.\n문자 \"a\"가 있으니 전부 문자로 바뀌어 \"1\" \"a\" \"TRUE\"가 됩니다.\n\nc(1, TRUE)라면 숫자형 1 1 (TRUE = 1)\n서로 다른 타입을 그대로 담고 싶다면 list()를 써야 해요.",
m:["벡터·행렬: 한 가지 타입만","리스트: 서로 다른 타입 가능","데이터프레임: 열마다 다른 타입 가능 (같은 열은 같은 타입)","R 인덱스는 1부터 시작 (x[1]이 첫 번째)","class(), str()로 타입 확인, as.numeric() 등으로 변환"]},

{s:3,q:"R에서 rep(1:2, each=2)의 결과는?",o:["1 2 1 2","1 1 2 2","2 2 1 1","1 2"],a:1,
e:"each = 2는 '각 원소를 2번씩 반복'해요. 1을 두 번, 2를 두 번 → 1 1 2 2\n\n비교\n· rep(1:2, times = 2) → 1 2 1 2 (전체를 2번 반복)\n· rep(1:2, each = 2, times = 2) → 1 1 2 2 1 1 2 2",
m:["seq(1, 10, by = 3) → 1 4 7 10","seq(1, 10, length.out = 4) → 1 4 7 10","1:5 → 1 2 3 4 5","matrix(1:6, nrow = 2) → 열 방향으로 채움 (1 3 5 / 2 4 6)","byrow = TRUE면 행 방향 (1 2 3 / 4 5 6)"]},

{s:3,q:"R에서 apply(m, 2, sum)의 의미는?",o:["행별 합계","열별 합계","전체 합계","2번째 행의 합계"],a:1,
e:"apply(데이터, MARGIN, 함수)에서 MARGIN이 1이면 행(가로) 방향, 2면 열(세로) 방향으로 함수를 적용해요. 그래서 apply(m, 2, sum)은 각 열의 합계.\n\n같은 결과를 내는 함수: colSums(m)\n행별 합계는 apply(m, 1, sum) = rowSums(m)",
m:["apply: 행렬·배열에 행/열 단위로 적용","lapply: 리스트에 적용, 결과도 리스트","sapply: lapply와 같지만 결과를 벡터로 단순화","tapply: 그룹별로 적용 (예: 성별 평균 키)","rbind = 행으로 붙이기, cbind = 열로 붙이기"]},

{s:3,q:"같은 환자들의 약 복용 전·후 혈압을 비교할 때 알맞은 검정은?",o:["독립표본 t검정","대응표본 t검정","카이제곱 검정","분산분석"],a:1,
e:"같은 사람에게서 두 번 측정했으니 두 값이 짝(쌍)을 이뤄요. 이렇게 짝지어진 데이터의 차이를 검정하는 것이 대응표본(paired) t검정이에요.\n\n다른 보기는?\n① 독립표본 t검정: 서로 다른 두 집단 비교 (남자 vs 여자), 먼저 등분산 검정\n③ 카이제곱 검정: 범주형 변수끼리의 관계\n④ 분산분석(ANOVA): 세 집단 이상 평균 비교",
m:["일표본 t검정: 한 집단 평균 vs 특정 값 (평균 키가 170인가?)","독립표본: 서로 다른 두 집단","대응표본: 같은 대상 전/후, 쌍둥이 비교","3집단 이상 → ANOVA (F = 집단 간 분산 / 집단 내 분산)","정규성 가정이 안 맞으면 비모수 검정: 윌콕슨 부호순위(대응), 만-위트니 U(독립), 크루스칼-왈리스(3집단 이상)"]},

{s:3,q:"평균과 분산이 같은(λ) 이산형 확률분포는?",o:["이항분포","포아송분포","정규분포","기하분포"],a:1,
e:"포아송분포는 '일정한 시간·공간에서 사건이 몇 번 일어나는가'를 나타내는 분포로, 평균과 분산이 모두 λ(람다)로 같아요.\n예) 1시간에 콜센터에 걸려오는 전화 수, 책 한 페이지의 오타 수\n\n다른 보기는?\n① 이항분포: n번 시행 중 성공 횟수, 평균 np, 분산 np(1−p)\n③ 정규분포: 연속형 분포\n④ 기하분포: 첫 성공까지 시도 횟수",
m:["이산형: 베르누이, 이항, 포아송, 기하, 음이항","연속형: 균일, 정규, 지수, t, 카이제곱, F","t분포: 자유도가 커질수록 정규분포에 가까워짐","카이제곱: 범주형 검정, 분산 검정 / F분포: 두 분산 비교, ANOVA","중심극한정리: 표본이 충분히 크면(n ≥ 30) 표본평균은 정규분포에 가까워짐"]},

{s:3,q:"부트스트랩에서 어떤 데이터가 한 번도 뽑히지 않을 확률은 약?",o:["10%","25%","36.8%","63.2%"],a:2,
e:"n개 데이터에서 복원추출로 n번 뽑을 때, 특정 데이터가 한 번 뽑힐 때 안 뽑힐 확률은 (1 − 1/n). n번 모두 안 뽑힐 확률은 (1 − 1/n)ⁿ 이고, n이 크면 e⁻¹ ≈ 0.368 (36.8%)로 수렴해요.\n\n63.2%는 '한 번 이상 뽑힐 확률'이에요 (함정).\n뽑히지 않은 36.8% 데이터는 OOB(Out-Of-Bag) 데이터로 검증에 쓸 수 있어요.",
m:["홀드아웃: 데이터를 한 번 나눔 (보통 학습 70% / 평가 30%)","K-fold 교차검증: K등분 → K번 돌아가며 1개로 검증 → 평균","LOOCV: 1개씩 빼서 검증 (K = n)","부트스트랩: 복원추출, 배깅·랜덤 포레스트의 기반","데이터 분할: 훈련용(학습) / 검증용(튜닝) / 평가용(최종 성능)"]},

{s:3,q:"다중 대치법의 진행 순서는?",o:["분석 → 대치 → 결합","대치 → 분석 → 결합","결합 → 대치 → 분석","대치 → 결합 → 분석"],a:1,
e:"다중 대치법은 결측치를 한 번만 채우지 않고 여러 번 채워서 불확실성까지 반영하는 방법이에요.\n① 대치(Imputation): 결측값을 채운 데이터셋을 여러 개 만듦\n② 분석(Analysis): 각 데이터셋을 따로 분석\n③ 결합(Combination): 여러 분석 결과를 하나로 합침",
m:["완전 정보 분석법(삭제): 결측 행 제거, 간단하지만 데이터 손실·편향 위험","평균 대치법: 평균으로 채움, 분산이 작아짐(과소 추정)","단순 확률 대치법: 비슷한 다른 데이터 값으로 채움 (Hot-deck, Nearest Neighbor)","R 함수: is.na() 결측 확인, na.omit() 결측 행 제거, complete.cases() 완전한 행, mean(x, na.rm = TRUE)","결측 시각화: Amelia 패키지 missmap()"]},

{s:3,q:"Q1 = 20, Q3 = 40일 때 사분위수 기준 이상치의 위쪽 경계는?",o:["50","60","70","80"],a:2,
e:"① IQR = Q3 − Q1 = 40 − 20 = 20\n② 위쪽 경계 = Q3 + 1.5 × IQR = 40 + 1.5 × 20 = 40 + 30 = 70\n③ 아래쪽 경계 = Q1 − 1.5 × IQR = 20 − 30 = −10\n\n70보다 크거나 −10보다 작은 값이 이상치예요. 박스플롯에서 수염 밖의 점으로 표시됩니다.",
m:["IQR = Q3 − Q1 (중간 50% 데이터의 범위)","박스플롯: 상자 = Q1~Q3, 가운데 선 = 중앙값, 수염 = 1.5 IQR 이내 최대·최소","ESD 방법: 평균 ± 3 × 표준편차 밖이면 이상치","이상치를 무조건 지우면 안 됨 (부정거래 탐지에선 이상치가 핵심)","평균은 이상치에 민감, 중앙값은 이상치에 강함"]},

{s:3,q:"오른쪽 꼬리가 긴(왜도 > 0) 분포에서 대표값의 크기 순서는?",o:["평균 > 중앙값 > 최빈값","최빈값 > 중앙값 > 평균","중앙값 > 평균 > 최빈값","모두 같다"],a:0,
e:"오른쪽 꼬리가 길다는 건 큰 값들이 일부 있다는 뜻이에요. 평균은 극단값에 끌려가서 가장 커지고, 최빈값은 데이터가 몰린 왼쪽 봉우리에 있어요. 그래서 평균 > 중앙값 > 최빈값.\n소득 분포를 떠올리면 쉬워요: 몇몇 고소득자 때문에 평균 소득이 중위 소득보다 높음.\n\n② 는 왼쪽 꼬리가 긴(왜도 < 0) 경우\n④ 는 좌우 대칭(정규분포)인 경우",
m:["왜도 > 0: 오른쪽 꼬리 (positive skew), 평균 > 중앙값 > 최빈값","왜도 < 0: 왼쪽 꼬리, 최빈값 > 중앙값 > 평균","왜도 = 0: 대칭, 셋이 같음","첨도: 분포의 뾰족한 정도 (정규분포 = 3, 또는 초과첨도 0)","변동계수 = 표준편차 / 평균 → 단위가 다른 자료의 퍼짐 비교"]},

{s:3,q:"과대적합(Overfitting)에 대한 설명으로 옳은 것은?",o:["훈련 데이터와 새 데이터 모두 성능이 낮다","훈련 데이터 성능은 높지만 새 데이터 성능은 낮다","변수가 너무 적어서 생긴다","데이터가 많을수록 심해진다"],a:1,
e:"과대적합은 모델이 훈련 데이터의 잡음까지 외워버려서, 훈련 데이터는 잘 맞히는데 처음 보는 데이터는 못 맞히는 상태예요. 기출문제 답만 외워서 새 문제를 못 푸는 학생과 같아요.\n\n다른 보기는?\n① 과소적합(Underfitting): 모델이 너무 단순해서 둘 다 못 맞힘\n③ 변수가 너무 '많거나' 모델이 너무 복잡할 때 생겨요\n④ 데이터가 많으면 오히려 과대적합이 줄어요",
m:["과대적합 해결: 가지치기, 정규화(Ridge·Lasso), 교차검증, 드롭아웃, 데이터 늘리기, 변수 줄이기","과소적합 해결: 더 복잡한 모델, 변수 추가","의사결정나무가 너무 깊으면 과대적합 → 가지치기","신경망 은닉층·노드가 너무 많으면 과대적합"]},

{s:3,q:"상관계수에 대한 설명으로 옳지 않은 것은?",o:["−1에서 1 사이 값을 가진다","0이면 선형 관계가 없다","스피어만 상관계수는 순위를 이용한다","상관계수가 크면 인과관계가 증명된다"],a:3,
e:"상관관계는 '같이 움직이는 정도'일 뿐, 하나가 다른 하나의 원인이라는 걸 증명하지 않아요. 아이스크림 판매량과 익사 사고는 상관이 높지만, 진짜 원인은 둘 다에 영향을 주는 '더위'예요.\n\n② 주의: 0은 '선형' 관계가 없다는 것이지, 아무 관계가 없다는 건 아니에요 (U자 모양 관계는 상관계수가 0에 가까울 수 있음).",
m:["피어슨 상관계수: 연속형(등간·비율), 선형 관계, 정규성 가정","스피어만 상관계수: 순서형, 순위 기반, 비모수","켄달의 타우: 순위 기반 상관","R: cor(x, y), 유의성은 cor.test(x, y)","공분산은 단위에 따라 크기가 달라서, 표준화한 상관계수를 씀"]},

{s:3,q:"인공신경망에서 출력값의 합이 1이 되도록 해 다중 분류에 쓰는 활성화 함수는?",o:["시그모이드","ReLU","소프트맥스","계단 함수"],a:2,
e:"소프트맥스는 여러 출력값을 0~1 사이 확률로 바꾸고, 그 합이 1이 되게 해요. 그래서 '사과 0.7, 배 0.2, 귤 0.1'처럼 여러 클래스 중 하나를 고르는 다중 분류의 출력층에 써요.\n\n다른 보기는?\n① 시그모이드: 0~1 출력, 이진 분류 (로지스틱 회귀와 같은 함수)\n② ReLU: 0 이하면 0, 양수는 그대로 → 은닉층에 주로 사용, 기울기 소실 완화\n④ 계단 함수: 0 또는 1, 초기 퍼셉트론",
m:["tanh: −1~1 출력","가중치 조정: 역전파(Backpropagation) 알고리즘","기울기 소실: 은닉층이 깊으면 시그모이드 기울기가 0에 가까워져 학습이 안 됨 → ReLU로 완화","단층 퍼셉트론은 XOR 문제를 못 풂 → 다층 퍼셉트론(은닉층)으로 해결","신경망 장점: 복잡한 비선형 관계 / 단점: 해석 어려움(블랙박스), 초기 가중치에 민감"]},

{s:3,q:"분류 모형의 F1 점수는 정밀도와 재현율의 어떤 평균일까?",o:["산술평균","기하평균","조화평균","가중평균"],a:2,
e:"F1 = 2 × 정밀도 × 재현율 / (정밀도 + 재현율) = 정밀도와 재현율의 조화평균이에요.\n\n조화평균은 두 값 중 작은 쪽에 더 끌려가요. 그래서 정밀도와 재현율 중 하나라도 낮으면 F1도 낮게 나와서, 둘의 균형을 평가하기 좋아요.\n예) 정밀도 0.8, 재현율 0.67 → F1 ≈ 0.73",
m:["F1은 0~1, 1에 가까울수록 좋음","Fβ 점수: β > 1이면 재현율을, β < 1이면 정밀도를 더 중시","불균형 데이터에서 정확도 대신 F1을 자주 봐요","카파 통계량: 우연히 맞힐 확률을 보정한 일치도"]},

{s:3,q:"카이제곱 검정이 적합한 상황은?",o:["두 집단 평균 비교","세 집단 평균 비교","성별과 선호 메뉴(범주형)의 관련성","키와 몸무게의 상관"],a:2,
e:"카이제곱 검정은 '범주형 변수'를 다뤄요. 성별(남/여)과 선호 메뉴(한식/양식/중식)처럼 빈도(개수)로 정리된 교차표에서, 관측 빈도가 기대 빈도와 얼마나 다른지 검정합니다.\n\n다른 보기는?\n① 두 집단 평균 → t검정\n② 세 집단 이상 평균 → 분산분석(ANOVA)\n④ 연속형 변수의 관계 → 상관분석",
m:["적합도 검정: 관측 분포가 기대 분포와 같은가? (주사위가 공정한가)","독립성 검정: 두 범주형 변수가 서로 독립인가? (성별과 메뉴 선호)","동질성 검정: 여러 집단의 분포가 같은가?","기대 빈도가 5 미만인 칸이 많으면 피셔의 정확 검정 사용","R: chisq.test()"]}
];
